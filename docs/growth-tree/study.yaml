# Presentation fixture, not campaign balance. Prices shown are content base prices.
budget: 460
tier: 2
owned: [backyard-clinics, word-of-mouth, weekend-leagues, local-radio, highlight-reels]
selected: street-courts
looks:
  clubhouse:
    name: Clubhouse board
    title: Build a following.
    caption: Raised upgrade tiles, clear branching routes, and a focused decision card. The closest continuation of the world map.
  floodlit:
    name: Under the lights
    title: Make your next move.
    caption: A midnight tactics board, luminous routes, and tactical markers. More stadium atmosphere; less card furniture.
  album:
    name: Club collection
    title: Give your sport a story.
    caption: A blue club album with collectible upgrade cards and chapter-like columns. Stronger personality, softer emphasis on routes.
forkNames:
  where-to-play: Where do we play?
  roots: Put down roots or hit the road?
  tv-deal: Who gets to watch?
  coverage: What makes the headlines?
summaries:
  backyard-clinics: Turn curious neighbours into first-time players.
  word-of-mouth: Give the local game a reason to travel.
  weekend-leagues: Help the first leagues get off the ground.
  street-courts: More people playing. Fewer becoming diehards.
  club-grounds: Build a devoted core behind the clubhouse doors.
  fan-meetups: Give your fans a reason to come back.
  volunteer-organisers: Keep the local game running on community effort.
  border-tournaments: Take the game to the neighbours.
  community-ownership: Make the sport harder to dislodge at home.
  barnstorming-tours: Trade stability for a place on the road.
  local-radio: Let the conversation cross language communities.
  newspaper-columns: Make your sport part of the morning routine.
  highlight-reels: Give the best moments a bigger audience.
  dubbed-broadcasts: Tell the story in the next market's language.
  pay-tv-exclusivity: A smaller audience. A lighter running bill.
  free-to-air: Open the doors to everyone watching at home.
  star-profiles: Turn familiar faces into reasons to care.
  sponsor-showcase: Buy protection at the expense of broad appeal.
  tabloid-buzz: A bigger crowd, with less reason to stay.
  satellite-feed: Take the spectacle beyond the local signal.
