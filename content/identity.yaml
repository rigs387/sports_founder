# Sport identity (GDD v1.18): the option lists the player chooses from at setup. Ids only; every
# player-facing word lives in the locale file (identity.*), and invented names live in names.yaml.
# Birthplace and ethos are founding character: until Culture is built they only color the
# rulebook and card text, and they never touch affinity or balance.

birthplaces: [schoolyard, factory, beach, barracks, village-green, docks]
ethos: [gentlemans-game, working-class-game, rebel-game, family-game]

# What a score, a match and a season are called. Each id needs singular, plural and title forms
# in the locale file; templates use them only as nouns. The first of each list is the default.
terms:
  score: [score, goal, point, run, try, basket, tally]
  match: [match, game, fixture, contest, bout]
  season: [season, campaign, series, term]

# Players a side by the genome's team size, as the rulebook and the field diagram show them.
playersPerSide: { small: 5, medium: 8, large: 11 }

# The preset emblem (the editor is Phase 2). Colors are hex values drawn by the UI; names for them
# live in the locale file. An emblem's two colors must differ.
emblem:
  shapes: [shield, roundel, pennant, diamond, crest]
  icons: [star, ball, crown, bolt, wing, oak, wave, tower]
  colors:
    navy: "#1f3a68"
    royal: "#2f63c8"
    sky: "#6fb4e8"
    crimson: "#b3263a"
    scarlet: "#e0442f"
    amber: "#f0a81c"
    gold: "#d8b23a"
    forest: "#2f7a43"
    emerald: "#22a06b"
    claret: "#7a1f3d"
    black: "#1b1b1f"
    white: "#f7f5ef"

# Odd trait pairings earn a deadpan line in the rulebook (GDD Sport Genome: all combinations are
# legal). A line applies when every listed axis has the listed option; at most maxOddLines show,
# in this order.
maxOddLines: 2
oddPairings:
  - { id: ice-innings, when: { surface: ice, structure: innings } }
  - { id: street-large-field, when: { surface: street, footprint: large } }
  - { id: indoor-large-field, when: { surface: indoor, footprint: large } }
  - { id: full-contact-precision, when: { contact: full, physical: precision } }
  - { id: ice-long-match, when: { surface: ice, matchLength: long } }
  - { id: small-team-large-field, when: { teamSize: small, footprint: large } }
  - { id: large-team-small-field, when: { teamSize: large, footprint: small } }
  - { id: gear-no-contact, when: { equipment: protective-gear, contact: none } }
  - { id: ice-marathon, when: { surface: ice, physical: endurance, matchLength: long } }

# Culture (GDD v1.22): founding character shapes culture, never affinity. Each birthplace sets an
# ease per tradition type: birth thresholds are divided by it and starting strength multiplied by
# it. Each ethos sets multipliers on the three betrayals: rule changes, the seat move and renaming
# the trophy. Content validation keeps every birthplace's eases and every ethos's multipliers at a
# geometric mean within 1 ± config culture.characterBand: character changes a campaign's shape,
# never its difficulty. Every birthplace and ethos above needs an entry; every type needs an ease.
culture:
  birthplaces:
    schoolyard: { derby: 0.85, rite: 0.9, legacy: 1.3, nationalName: 1.1, venue: 0.9, trophy: 1 }
    factory: { derby: 1.35, rite: 0.9, legacy: 0.9, nationalName: 1, venue: 1.1, trophy: 0.85 }
    beach: { derby: 0.9, rite: 0.9, legacy: 1.3, nationalName: 1.15, venue: 0.8, trophy: 1 }
    barracks: { derby: 0.9, rite: 1.3, legacy: 0.8, nationalName: 0.95, venue: 1.2, trophy: 1 }
    village-green: { derby: 0.8, rite: 1.25, legacy: 0.85, nationalName: 0.95, venue: 1, trophy: 1.25 }
    docks: { derby: 1.3, rite: 1, legacy: 0.85, nationalName: 1.1, venue: 0.9, trophy: 0.95 }
  ethos:
    gentlemans-game: { rules: 1.3, seat: 0.9, rename: 0.85 }
    working-class-game: { rules: 0.65, seat: 1.3, rename: 1.2 }
    rebel-game: { rules: 0.7, seat: 1.3, rename: 1.1 }
    family-game: { rules: 0.9, seat: 0.85, rename: 1.3 }
