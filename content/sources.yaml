# Where every figure in countries.yaml and sports.yaml comes from (GDD "Real-world data":
# every field records its source and year; estimates are tagged). Content validation fails if a
# market is missing a source for any sourced field, or cites a dataset that is not listed here.
#
# `defaults` covers every market; `countries` records the exceptions and every fan-bucket figure.
# An entry carries either `dataset` (a published source) or `estimate` (a figure modeled for this
# project, with what it was modeled on).
#
# Compilation note (GDD): this dataset was compiled by an AI research session. The developer
# spot-checks the recommended starts and the biggest soccer and cricket markets before the data is
# trusted for balance work. Fan buckets are the softest numbers here. A `survey-interest` tag means
# the figure reproduces published interest shares to the nearest 0.01 of population from the named
# body of survey work; it is not a citation of one table, and it has not been checked line by line.
# Everywhere else the buckets are modeled on a named neighbouring market. Treat every fan figure as
# a starting point for balance work, not as a measurement.

datasets:
  wb-population:
    title: "World Bank, World Development Indicators - Population, total (SP.POP.TOTL)"
    url: https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL
    retrieved: 2026-09-15
  wb-income:
    title: "World Bank, World Development Indicators - GNI per capita, Atlas method, current US$ (NY.GNP.PCAP.CD)"
    url: https://api.worldbank.org/v2/country/all/indicator/NY.GNP.PCAP.CD
    retrieved: 2026-09-15
  wb-urban:
    title: "World Bank, World Development Indicators - Urban population (% of total) (SP.URB.TOTL.IN.ZS)"
    url: https://api.worldbank.org/v2/country/all/indicator/SP.URB.TOTL.IN.ZS
    retrieved: 2026-09-15
  geonames:
    title: "GeoNames countryInfo.txt - land borders between countries and territories"
    url: https://download.geonames.org/export/dump/countryInfo.txt
    retrieved: 2026-09-15
  koppen:
    title: "Koppen-Geiger climate classification, main group at the country's population centre"
  hand-listed:
    title: "Hand-listed for this project and reviewed against a world map"
  gdd:
    title: "sports-founder-gdd.md - the design contract"
  estimate:
    title: "Modeled for this project where no published figure covers the market; see each note"
  survey-interest:
    title: "Published sports-interest surveys (Nielsen Sports fan reports, YouGov sport interest trackers, Ipsos national polls, ICC and national federation market research), read as: 'very interested' -> hardcore, remaining 'interested' -> casual, rounded to the nearest 0.01 of population"
  ons:
    title: "Office for National Statistics (UK) - mid-year population estimates and census urban/rural classification"
  ons-regional:
    title: "Office for National Statistics regional GDP per head, applied to the UK's World Bank GNI per capita"
  nrs:
    title: "National Records of Scotland - population estimates and urban/rural classification"
  nisra:
    title: "Northern Ireland Statistics and Research Agency - population estimates and settlement classification"
  dgbas:
    title: "Directorate-General of Budget, Accounting and Statistics, Chinese Taipei - national accounts and population"
  ck-stats:
    title: "Cook Islands Statistics Office"
  ai-stats:
    title: "Anguilla Statistics Department"
  ms-stats:
    title: "Montserrat Statistics Department"
  jersey-stats:
    title: "Statistics Jersey - population and GVA per head"
  guernsey-stats:
    title: "Guernsey Data and Analysis - population and GVA per head"

# Applies to every market unless the market overrides it below.
defaults:
  population: { dataset: wb-population, year: 2024 }
  incomePerPerson: { dataset: wb-income, year: 2024 }
  urbanShare: { dataset: wb-urban, year: 2024 }
  climate: { dataset: koppen, note: "the group where most people live, not most land: Australia is temperate" }
  continent: { dataset: gdd }
  languages: { dataset: hand-listed, note: "15 broad media spheres; a language matching none of them gets its own sphere and so has no language channel" }
  neighbors: { dataset: geonames }
  seaLinks: { dataset: hand-listed, note: "nearest mainland and same-basin islands, so island markets still spread" }
  otherHardcoreShare: { dataset: estimate, note: "per-continent default in sports.yaml; the markets below override it where another sport clearly dominates" }

