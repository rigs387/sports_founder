# Every departure from "FIFA's member associations", with its reason (GDD Map and markets).
markets:
  added:
    tuvalu: "the GDD's signature hard anchor; an OFC associate, not a FIFA member"
    jersey: "ICC member with a national team; not a FIFA member"
    guernsey: "ICC member with a national team; not a FIFA member"
    isle-of-man: "ICC member with a national team; not a FIFA member"
  omitted:
    Kosovo: "contested status, left out with Palestine (GDD Map and markets, decided 2026-09-13)"
    Palestine: "contested status, left out with Kosovo (GDD Map and markets, decided 2026-09-13)"
    Saint Helena: "ICC membership inactive, population about 4,000, no competitive programme (decided 2026-09-15)"
    United Kingdom: "not a market: England, Scotland, Wales and Northern Ireland are separate FIFA members"
  # Land borders GeoNames lists that lead out of the market list, dropped with their reason.
  borders-dropped:
    "albania->XK": "Kosovo - omitted market"
    "france->MC": "Monaco - not a FIFA member"
    "israel->PS": "Palestine - omitted market"
    "italy->VA": "Vatican City - not a FIFA member"
    "montenegro->XK": "Kosovo - omitted market"
    "north-macedonia->XK": "Kosovo - omitted market"
    "serbia->XK": "Kosovo - omitted market"
    "algeria->EH": "Western Sahara - no market"
    "egypt->PS": "Palestine - omitted market"
    "mauritania->EH": "Western Sahara - no market"
    "morocco->EH": "Western Sahara - no market"
    "jordan->PS": "Palestine - omitted market"
    "suriname->GF": "French Guiana - not a FIFA member"
    "brazil->GF": "French Guiana - not a FIFA member"
