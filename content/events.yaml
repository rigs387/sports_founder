# First playable deck. All triggers reference actual campaign facts; prose lives in en.json.
settings:
  baseMoments: 1
  momentsPerQuarter: 1
  marketsPerExtraMoment: 40
  maxMoments: 6
  maxDecisions: 2
  activeFans: 1000
  historyLimit: 60
  minFactor: 0.25
  maxFactor: 3
cards:
  - id: open-doors
    kind: decision
    tone: positive
    priority: 100
    trigger: audience
    minQuarter: 1
    minFans: 100
    minHardcore: 10
    minTier: 1
    anchorOnly: true
    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    defaultChoice: hold
    choices:
      - id: welcome
        cost: 8
        effects:
          - { type: conversion, target: casual, factor: 1.35, quarters: 4 }
          - { type: conversion, target: hardcore, factor: 0.85, quarters: 4 }
      - id: regulars
        cost: 0
        effects:
          - { type: conversion, target: hardcore, factor: 1.2, quarters: 4 }
          - { type: conversion, target: casual, factor: 0.85, quarters: 4 }
      - { id: hold, cost: 0, effects: [] }
  - id: first-following
    kind: moment
    tone: positive
    priority: 60
    trigger: audience
    minQuarter: 1
    minFans: 1000
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: country
    cooldownTurns: null
    health: []
    effects: [{ type: pp, amount: 5 }]
    choices: []
    defaultChoice: null
  - id: league-arrival
