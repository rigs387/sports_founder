  # Flagship stars as cards (GDD v1.16). Built from recorded facts only: a season's new star, or a
  # star landmark. The breakout moment (PP by league tier: config flagship.stars.breakoutPP) takes
  # no moment slot; the other moments use moment slots; the decisions count against maxDecisions
  # and come after the season cards. Unanswered decisions take their free default: the backed star
  # retires without honors or a successor, the backed star's move stands, the drop is ridden out.
  # Kept subtle on purpose: stars are a story first.
  # Traditions (GDD v1.22): a moment for every tradition born or lost, told from the facts recorded
  # on the tradition. Each uses a moment slot; a birth pays culture.birthPP by its type (config).
  - id: tradition-born
    kind: moment
    weight: big
    tone: positive
    priority: 200
    trigger: tradition
    tradition: born
    minQuarter: 0
    minFans: 0
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    choices: []
    defaultChoice: null
