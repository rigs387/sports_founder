        effects: [{ type: conversion, target: hardcore, factor: 1.2, quarters: 4 }]
      - { id: hold, cost: 0, effects: [] }
  # Rivals win ground back near #1 (GDD v1.17). A reclaim tells where a rival is taking the
  # player's hardcore fans back; a world championship is told once, in the player's biggest market.
  # Both only inform: their effect is the rival's own.
