    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    arrivalEffects:
      - { type: conversion, target: casual, factor: 0.8, quarters: 4 }
    defaultChoice: hold
    choices:
      - id: draft-lottery
        cost: 12
        effects:
          - { type: clubRating, target: champion, steps: -2 }
          - { type: clubRating, target: field, steps: 1 }
      - { id: hold, cost: 0, effects: [] }
