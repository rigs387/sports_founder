# First playable deck. All triggers reference actual campaign facts; prose lives in en.json.
settings:
  baseMoments: 1
  momentsPerQuarter: 1
  marketsPerExtraMoment: 40
  maxMoments: 6
  maxDecisions: 2
  activeFans: 1000
  historyLimit: 60
  minFactor: 0.25
  maxFactor: 3
  # Moments have weight (GDD v1.26): each moment card says minor (a toast), big (a back page over
  # the map) or headline (a front page). A season's champion moment becomes a headline while the
  # flagship league is at one of these tiers only if its season tells one of headlineStories (GDD
  # v1.32: a playtest saw 62 front pages in 75 seasons); the sport's first star always is one.
  flagshipHeadlineTiers: [professional, elite]
  headlineStories: [firstTitle, underdog, dynasty, foregone]
cards:
  - id: open-doors
    kind: decision
    tone: positive
    priority: 100
    trigger: audience
    minQuarter: 1
    minFans: 100
    minHardcore: 10
    minTier: 1
    anchorOnly: true
    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    defaultChoice: hold
    choices:
      - id: welcome
        cost: 8
        effects:
          - { type: conversion, target: casual, factor: 1.35, quarters: 4 }
          - { type: conversion, target: hardcore, factor: 0.85, quarters: 4 }
      - id: regulars
        cost: 0
        effects:
          - { type: conversion, target: hardcore, factor: 1.2, quarters: 4 }
          - { type: conversion, target: casual, factor: 0.85, quarters: 4 }
      - { id: hold, cost: 0, effects: [] }
  - id: first-following
    kind: moment
    weight: minor
    tone: positive
    priority: 60
    trigger: audience
    minQuarter: 1
    minFans: 1000
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: country
    cooldownTurns: null
    health: []
    effects: [{ type: pp, amount: 5 }]
    choices: []
    defaultChoice: null
  - id: league-arrival
    kind: moment
    weight: minor
    tone: positive
    priority: 80
    trigger: leagueFormed
    minQuarter: 1
    minFans: 0
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: country
    cooldownTurns: null
    health: []
    effects: [{ type: pp, amount: 10 }]
    choices: []
    defaultChoice: null
  - id: moving-up
    kind: moment
    weight: minor
    tone: positive
    priority: 90
    trigger: leaguePromoted
    minQuarter: 1
    minFans: 0
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: country
    cooldownTurns: 8
    health: []
    effects: [{ type: pp, amount: 12 }]
    choices: []
    defaultChoice: null
  - id: local-airtime
    kind: decision
    tone: positive
    priority: 50
    trigger: audience
    minQuarter: 8
    minFans: 30000
    minHardcore: 200
    minTier: 1
    anchorOnly: false
    scope: campaign
    cooldownTurns: 12
    health: []
    effects: []
    defaultChoice: hold
    choices:
      - id: broadcast
        cost: 35
        effects:
          - { type: spread, target: media, factor: 1.5, quarters: 8 }
          - { type: conversion, target: hardcore, factor: 0.9, quarters: 8 }
      - id: neighbourhood
        cost: 20
        effects:
          - { type: spread, target: proximity, factor: 1.35, quarters: 8 }
          - { type: fanShift, target: uninterestedToCasual, share: 0.0001 }
      - { id: hold, cost: 0, effects: [] }
  - id: crowded-sidelines
    kind: decision
    tone: positive
    priority: 40
    trigger: audience
    minQuarter: 4
    minFans: 5000
    minHardcore: 50
    minTier: 1
    anchorOnly: false
    scope: campaign
    cooldownTurns: 10
    health: []
    effects: []
    defaultChoice: hold
    choices:
      - id: recruit
        cost: 20
        effects: [{ type: fanShift, target: casualToHardcore, share: 0.02 }]
      - id: fundraise
        cost: 0
        effects:
          - { type: pp, amount: 12 }
          - { type: conversion, target: casual, factor: 0.85, quarters: 4 }
      - { id: hold, cost: 0, effects: [] }
  - id: league-under-strain
    kind: decision
    tone: pressure
    priority: 95
    trigger: leaguePressure
