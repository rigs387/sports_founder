  # The flagship season as cards (GDD v1.15). Every season end offers the champion moment (PP by
  # league tier: config flagship.stories.championPP; it never takes a moment slot) and at most one
  # story card, the first that qualifies in the GDD's fixed order: foregone, runaway, dynasty,
  # repeat final, underdog, first title, close finish (SEASON_STORIES; `priority` is not used for
  # season cards). A story card counts against maxDecisions but is offered first. Pressure cards'
  # arrivalEffects land when the card appears; paying adds the fix and never cancels them.
  # Thresholds live in config flagship.stories.
  - id: season-champion
    kind: moment
    tone: positive
    priority: 200
    trigger: seasonEnd
    story: champion
    minQuarter: 0
    minFans: 0
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    choices: []
    defaultChoice: null
  - id: season-foregone
    kind: decision
    tone: pressure
    priority: 200
    trigger: seasonEnd
    story: foregone
    minQuarter: 0
    minFans: 0
    minHardcore: 0
    minTier: 1
    anchorOnly: false
    scope: campaign
    cooldownTurns: null
    health: []
    effects: []
    arrivalEffects:
      - { type: conversion, target: casual, factor: 0.8, quarters: 4 }
    defaultChoice: hold
    choices:
      - id: draft-lottery
        cost: 12
        effects:
          - { type: clubRating, target: champion, steps: -2 }
          - { type: clubRating, target: field, steps: 1 }
      - { id: hold, cost: 0, effects: [] }
