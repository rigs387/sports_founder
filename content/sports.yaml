# PLACEHOLDER rival sports. Invented names; the genomes are the GDD's soccer (fieldball) and
# cricket (longbat) genomes as stand-ins until the real-world dataset arrives.
# Display names live in names.yaml. The ids "player" and "other" are reserved.

rivals:
  # Global giant (soccer stand-in).
  - id: fieldball
    genome:
      surface: grass
      equipment: ball-only
      physical: endurance
      footprint: large
      contact: incidental
      teamSize: large
      matchLength: standard
      scoring: low
      complexity: simple
      structure: continuous
  # Regional stronghold (cricket stand-in).
  - id: longbat
    genome:
      surface: grass
      equipment: stick-or-bat
      physical: precision
      footprint: large
      contact: none
      teamSize: large
      matchLength: long
      scoring: high
      complexity: intricate
      structure: innings

# The "other sports" bucket (GDD Real-world data): the hardcore share held by every sport that is
# not modeled. It occupies part of each country's exclusive hardcore pie and never defends.
# A country may override its share in countries.yaml (`otherHardcoreShare`).
otherSports:
  hardcoreShareByContinent:
    africa: 0.03
    asia: 0.04
    europe: 0.06
    north-america: 0.1
    south-america: 0.05
    oceania: 0.06
