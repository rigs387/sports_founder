# Rival sports (GDD Rival AI). Phase 0 models soccer (the global giant) and cricket (the regional
# stronghold); every other sport's hardcore share sits in the passive "other sports" bucket. Genomes
# are the GDD's rival genome table. Real sport names are used; display names live in names.yaml.
# The ids "player" and "other" are reserved.

rivals:
  # The global giant.
  - id: soccer
    genome:
      surface: grass
      equipment: ball-only
      physical: endurance
      footprint: large
      contact: incidental
      teamSize: large
      matchLength: standard
      scoring: low
      complexity: simple
      structure: continuous
  # The regional stronghold.
  - id: cricket
    genome:
      surface: grass
      equipment: stick-or-bat
      physical: precision
      footprint: large
      contact: none
      teamSize: large
      matchLength: long
      scoring: high
      complexity: intricate
      structure: innings

# The "other sports" bucket (GDD Real-world data): the hardcore share held by every sport that is
# not modeled - basketball, American football, baseball, ice hockey, rugby, combat sports and the
# rest. It occupies part of each country's exclusive hardcore pie and never defends. A country
# overrides its share in countries.yaml (`otherHardcoreShare`) wherever another sport clearly
# dominates; these are the per-continent defaults for everywhere else.
otherSports:
  hardcoreShareByContinent:
    africa: 0.05
    asia: 0.06
    europe: 0.1
    north-america: 0.15
    south-america: 0.07
    oceania: 0.14
