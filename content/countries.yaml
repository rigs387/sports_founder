# Real-world markets (GDD "Real-world data", decided 2026-09-13). Generated from a World Bank and
# GeoNames snapshot plus the hand-authored calls listed in sources.yaml; every field's source and
# year lives there. Do not hand-edit population, incomePerPerson or urbanShare without updating
# sources.yaml to match: content validation requires a source entry for every field.
#
# Markets: FIFA's 211 member associations, minus Kosovo and Palestine, plus Tuvalu (the GDD's
# signature hard anchor, an OFC associate) and the three ICC members outside FIFA (Jersey,
# Guernsey, Isle of Man). 213 in all. The United Kingdom is not a market: England, Scotland, Wales
# and Northern Ireland are, as FIFA counts them. See sources.yaml `markets` for every addition and
# omission with its reason.
#
# Attributes (GDD Country attributes):
#   continent          africa / asia / europe / north-america / south-america / oceania
#   climate            tropical / arid / temperate / cold (the Koppen group where most people live)
#   incomePerPerson    GNI per person, Atlas method, current US$ -> wealth score via config
#   urbanShare         share of the population living in urban areas -> urban density score
#   languages          primary media sphere plus an optional secondary one
#   neighbors          land borders. Links are undirected: listing a link on either side is enough.
#   seaLinks           hand-listed sea links, so islands have proximity spread
#   startingRivalFans  share of the population casual / hardcore about each rival
#   otherHardcoreShare optional override of the continent default for the "other sports" bucket
# Derived at load: sport culture (all starting hardcore shares) and media market (population x
# wealth score). Display names live in names.yaml.

