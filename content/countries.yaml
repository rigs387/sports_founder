# PLACEHOLDER countries. Invented: no real-world data. The real dataset (GDD Real-world data) is a
# separate research task and replaces this file with the same shape.
#
# Attributes (GDD Country attributes):
#   continent          africa / asia / europe / north-america / south-america / oceania
#   climate            tropical / arid / temperate / cold (the zone where most people live)
#   incomePerPerson    raw figure → wealth score 0–1 via config attributeCurves.wealth
#   urbanShare         raw share of population living in urban areas → urban density score
#   languages          primary media sphere plus an optional secondary one
#   neighbors          land borders. Links are undirected: listing a link on either side is enough.
#   seaLinks           hand-listed sea links, so islands have proximity spread
#   startingRivalFans  share of the population casual / hardcore about each rival
#   otherHardcoreShare optional override of the continent default for the "other sports" bucket
# Derived at load: sport culture (all starting hardcore shares) and media market (population ×
# wealth score). Display names live in names.yaml.

countries:
