# PP growth tree (GDD PP Growth Tree). Phase 0 builds Grassroots and Media only. Every number here
# is tuning; the node set and the forks are design (approved 2026-09-13).
#
# categories   the PP tier at which each category's nodes can be bought (the current tier, not the
#              peak: a demoted sport keeps its nodes but cannot buy from a category it no longer has)
# limits.minFactor
#              every node effect ends up as a factor on a rate, cost or effect size in a country:
#                bonuses     factor = 1 + total      (casual/hardcore conversion, spread channels,
#                                                     PP income)
#                reductions  factor = 1 − total      (churn, formation threshold, cold-launch
#                                                     premium, running cost, rival countermoves)
#              and no factor ever goes below minFactor. Negative amounts (fork downsides) raise the
#              reduced quantity or lower the bonus.
#
# Nodes
#   quarters   PP price in quarters of income (see costScaling)
#   requires   node ids in the same category that must be owned first
#   effects    from the closed vocabulary below, validated at load:
#                spreadChannel (with channel: proximity / language / media)
#                              inbound spread over that channel into the country
#                casualConversion, hardcoreConversion   the player's conversion rates in the country
#                churnReduction                         casual churn and decay in the country
#                formationThresholdReduction            hardcore fans a league needs to form there
#                coldLaunchCostReduction                the cold-launch premium of a focus slot
#                                                       there (the part above the exposed cost)
#                ppIncome                               PP income from the country's Fandom Score
#                runningCostReduction                   league running cost there
#                countermoveResistance                  the size of every rival countermove's
#                                                       effect on the player there
#   conditions optional, the genome's condition style (see genome.yaml): climate deltas and numeric
#              weights on wealth, urbanDensity, sportCulture, mediaMarket, added to the amount in
#              each country. A condition can shrink an effect to nothing but never flips its sign.
#              Unlike a genome option's, a node's climate deltas are used as written, not centred on
#              the world: a node is a thing the player buys, so a climate delta here is meant to make
#              it worth more or less overall, not only to say where it pays best.
#
# Forks: exclusive choices. Owning one node of a fork locks out the others for good (no refunds).

categories:
  grassroots: { unlockTier: 1 }
  media: { unlockTier: 2 }
  culture: { unlockTier: 4 }

limits:
  minFactor: 0.25

# A node's price is its quarters of PP income (config ppPrices: base income per quarter, never
# below the floor) × (1 + perNodeOwned) ^ nodes owned (GDD v1.34). Quarters by category:
# Grassroots 3-6, Media 6-12, Culture 10-16, deeper nodes at the top of their range. This replaces
# the v1.9 size factor and the tier multiplier: prices grew with the sport (^0.6) faster than income
# (^0.5) and ×6 by tier 5, so a playtest never afforded a Media node. The per-node rise keeps the
# tree a choice (choose pain).
costScaling:
  perNodeOwned: 0.05

forks:
  - id: where-to-play
    nodes: [ street-courts, club-grounds ]
  - id: roots
    nodes: [ community-ownership, barnstorming-tours ]
  - id: tv-deal
    nodes: [ pay-tv-exclusivity, free-to-air ]
  - id: coverage
    nodes: [ sponsor-showcase, tabloid-buzz ]
  - id: culture-way
    nodes: [ heritage-trust, living-game ]

nodes:
  # ---- Grassroots (tier 1): proximity spread, casual conversion, league formation, churn ----------
  - id: backyard-clinics
    category: grassroots
    quarters: 3
    requires: []
    effects:
      - { type: casualConversion, amount: 0.16 }

  - id: word-of-mouth
    category: grassroots
    quarters: 3.5
    requires: [ backyard-clinics ]
    effects:
      - { type: spreadChannel, channel: proximity, amount: 0.48 }

  - id: weekend-leagues
    category: grassroots
    quarters: 3.5
    requires: [ backyard-clinics ]
    effects:
      - { type: formationThresholdReduction, amount: 0.48 }

  # Fork "where to play": wide and cheap in dense, lower-income countries, or deep in wealthy ones.
  - id: street-courts
    category: grassroots
    quarters: 4
    requires: [ backyard-clinics ]
    effects:
      - type: casualConversion
        amount: 0.24
        conditions: { urbanDensity: 0.1, wealth: -0.1 }
      - { type: hardcoreConversion, amount: -0.16 }

  - id: club-grounds
    category: grassroots
    quarters: 4
    requires: [ backyard-clinics ]
    effects:
      - type: hardcoreConversion
        amount: 0.16
        conditions: { wealth: 0.1 }
      - { type: churnReduction, amount: 0.16 }
      # Membership fees: fewer casual fans, but only where people are poorer.
      - type: casualConversion
        amount: -0.08
        conditions: { wealth: 0.05 }

  - id: fan-meetups
    category: grassroots
    quarters: 4
    requires: [ word-of-mouth ]
    effects:
      - { type: churnReduction, amount: 0.24 }

  - id: volunteer-organisers
    category: grassroots
    quarters: 4.5
    requires: [ weekend-leagues ]
    effects:
      - type: runningCostReduction
        amount: 0.16
        conditions: { wealth: -0.1 }

  - id: border-tournaments
    category: grassroots
    quarters: 5
    requires: [ word-of-mouth ]
    effects:
      - { type: spreadChannel, channel: proximity, amount: 0.64 }
      - { type: coldLaunchCostReduction, amount: 0.4 }

  # Fork "roots": dig in at home, or tour to open new markets.
  - id: community-ownership
    category: grassroots
    quarters: 6
    requires: [ fan-meetups, volunteer-organisers ]
    effects:
      - { type: churnReduction, amount: 0.24 }
      - { type: countermoveResistance, amount: 0.48 }
      - { type: coldLaunchCostReduction, amount: -0.32 }

  - id: barnstorming-tours
    category: grassroots
    quarters: 6
    requires: [ fan-meetups, volunteer-organisers ]
    effects:
      - { type: coldLaunchCostReduction, amount: 0.64 }
      - { type: formationThresholdReduction, amount: 0.32 }
      - { type: churnReduction, amount: -0.16 }

  # ---- Media (tier 2): media reach and language channels, casual reach ---------------------------
  - id: local-radio
    category: media
    quarters: 6
    requires: []
    effects:
      - { type: spreadChannel, channel: language, amount: 0.48 }

  - id: newspaper-columns
    category: media
    quarters: 7
    requires: [ local-radio ]
    effects:
      - type: casualConversion
        amount: 0.16
        conditions: { wealth: 0.05 }

  - id: highlight-reels
    category: media
    quarters: 7
    requires: [ local-radio ]
    effects:
      - { type: spreadChannel, channel: media, amount: 0.8 }

  - id: dubbed-broadcasts
    category: media
    quarters: 8
    requires: [ local-radio ]
    effects:
      - { type: spreadChannel, channel: language, amount: 0.64 }
      - { type: coldLaunchCostReduction, amount: 0.32 }

  # Fork "TV deal": league cash, or casual reach.
  - id: pay-tv-exclusivity
    category: media
    quarters: 9
    requires: [ highlight-reels ]
    effects:
      - type: runningCostReduction
        amount: 0.32
        conditions: { mediaMarket: 0.1 }
      - { type: casualConversion, amount: -0.16 }

  - id: free-to-air
    category: media
    quarters: 9
    requires: [ highlight-reels ]
    effects:
      - type: casualConversion
        amount: 0.16
        conditions: { mediaMarket: 0.1 }
      - { type: spreadChannel, channel: media, amount: 0.4 }
      - { type: runningCostReduction, amount: -0.16 }

  - id: star-profiles
    category: media
    quarters: 9
    requires: [ newspaper-columns ]
    effects:
      - { type: hardcoreConversion, amount: 0.16 }
      - { type: churnReduction, amount: 0.16 }

  # Fork "coverage": protection and PP, or casual volume that comes and goes.
  - id: sponsor-showcase
    category: media
    quarters: 10.5
    requires: [ star-profiles ]
    effects:
      - { type: countermoveResistance, amount: 0.64 }
      - { type: ppIncome, amount: 0.128 }
      - { type: casualConversion, amount: -0.08 }

  - id: tabloid-buzz
    category: media
    quarters: 10.5
    requires: [ star-profiles ]
    effects:
      - type: casualConversion
        amount: 0.24
        conditions: { urbanDensity: 0.1 }
      - { type: churnReduction, amount: -0.24 }

  - id: satellite-feed
    category: media
    quarters: 12
    requires: [ highlight-reels, dubbed-broadcasts ]
    effects:
      - { type: spreadChannel, channel: media, amount: 0.96 }
      - { type: ppIncome, amount: 0.08 }

  # ---- Culture (tier 4, GDD v1.22): nurture traditions that exist; never create one ----------------
  # Culture effects apply everywhere (no conditions) and may name one traditionType:
  #   traditionStrength    bigger renewals and slower yearly decay
  #   traditionReach       a yearly chance to gain a follower along proximity or language links
  #                        (channel limits it to one); national names never spread
  #   traditionProtection  less strength lost to an offending amendment
  #   traditionHold        more weight per unit of strength: stickier fans, and harder betrayals
  - id: oral-history
    category: culture
    quarters: 10
    requires: []
    effects:
      - { type: traditionStrength, amount: 0.3 }

  - id: derby-days
    category: culture
    quarters: 10
    requires: []
    effects:
      - { type: traditionStrength, traditionType: derby, amount: 0.6 }
      - { type: traditionHold, traditionType: derby, amount: 0.2 }

  - id: supporters-trusts
    category: culture
    quarters: 11
    requires: []
    effects:
      - { type: traditionProtection, amount: 0.4 }

  - id: club-museum
    category: culture
    quarters: 11
    requires: [ oral-history ]
    effects:
      - { type: traditionStrength, traditionType: rite, amount: 0.5 }
      - { type: traditionStrength, traditionType: venue, amount: 0.5 }

  - id: hall-of-legends
    category: culture
    quarters: 11
    requires: [ oral-history ]
    effects:
      - { type: traditionStrength, traditionType: legacy, amount: 0.6 }
      - { type: traditionHold, traditionType: legacy, amount: 0.2 }

  - id: travelling-support
    category: culture
    quarters: 12
    requires: [ derby-days ]
    effects:
      - { type: traditionReach, channel: proximity, amount: 0.5 }

  - id: twinned-towns
    category: culture
    quarters: 12
    requires: [ oral-history ]
    effects:
      - { type: traditionReach, channel: language, amount: 0.5 }

  - id: heritage-listing
    category: culture
    quarters: 11
    requires: [ supporters-trusts ]
    effects:
      - { type: traditionProtection, traditionType: venue, amount: 0.4 }
      - { type: traditionHold, traditionType: venue, amount: 0.3 }

  # The fork (choose pain): Heritage trust holds traditions harder, so fans resist every change
  # more; Living game spreads and grows them but leaves them easier to break.
  - id: heritage-trust
    category: culture
    quarters: 16
    requires: [ supporters-trusts ]
    effects:
      - { type: traditionProtection, amount: 0.3 }
      - { type: traditionHold, amount: 0.3 }

  - id: living-game
    category: culture
    quarters: 16
    requires: [ supporters-trusts ]
    effects:
      - { type: traditionReach, amount: 0.5 }
      - { type: traditionStrength, amount: 0.3 }
      - { type: traditionProtection, amount: -0.3 }
