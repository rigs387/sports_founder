# PP growth tracks (GDD v1.35, replacing the v1.5 tree). Every number here is tuning; the tracks,
# levels and forks are design (decided 2026-10-09).
#
# categories   the four tracks and the PP tier at which each opens (the current tier, not the
#              peak: a demoted sport keeps its levels but cannot buy from a track it no longer has)
# limits.minFactor
#              every effect on a rate, cost or effect size ends up as a factor in a country:
#                bonuses     factor = 1 + total      (casual/hardcore conversion, spread channels,
#                                                     PP income)
#                reductions  factor = 1 − total      (churn, formation threshold, cold-launch
#                                                     premium, running cost, rival countermoves)
#              and no factor ever goes below minFactor. Negative amounts (fork downsides) raise the
#              reduced quantity or lower the bonus.
#
# Levels: each track has 12, bought in order. A step is one node; levels 4, 8 and 12 are forks, two
# nodes of which the player takes one for good (no refunds), and the track goes no further until a
# side is taken (the next level requires either side: requiresAny).
#   quarters   PP price in quarters of income (see costScaling)
#   effects    the closed vocabulary, validated at load. Rates in a country (with optional
#              conditions, the genome's style): spreadChannel (channel: proximity / language /
#              media), casualConversion, hardcoreConversion, churnReduction,
#              formationThresholdReduction, coldLaunchCostReduction, ppIncome,
#              runningCostReduction, countermoveResistance.
#              Culture (any track, global): traditionStrength, traditionReach, traditionProtection,
#              traditionHold, with an optional traditionType.
#              Shaping the sport (global, no conditions; factor = 1 + total unless noted):
#                climateFit     how much climate counts in the sport's fit
#                sponsorValue   sponsor and naming-rights offers at the flagship
#                mediaRevenue   every league's media revenue
#                ratingParity   how fast flagship club strength returns to the league's mean
#                flagshipClubs  the flagship's club count (rounded)
#                wageFactor     star wages and the payroll at the seat
#                starPlaces     star places by league tier (rounded)
#                starMoves      a star's chance to move clubs
#                scoring        scoring chances in flagship matches
#                starPull       a backed star's pull on casual conversion
#                traditionBirth (with traditionType) divides that type's birth thresholds
#                puristBacklash once, at purchase: this share of hardcore fans in the anchor turn
#                               casual

categories:
  grassroots: { unlockTier: 1 }
  media: { unlockTier: 2 }
  institutions: { unlockTier: 3 }
  culture: { unlockTier: 3 }

limits:
  minFactor: 0.25

# A level's price is its quarters of PP income (config ppPrices: base income per quarter, never
# below the floor) × (1 + perNodeOwned) ^ levels owned (GDD v1.34). Quarters rise along a track and
# by track (Grassroots 0.6–2.2, Media 0.8–2.4, Institutions and Culture 1.1–2.7, forks at the top), set so a
# campaign buys about one level every 2–3 turns (runner: purchases a turn).
costScaling:
  perNodeOwned: 0.02

forks:
  - { id: gear, nodes: [cheap-gear, premium-gear] }
  - { id: where-to-play, nodes: [indoor-halls, outdoor-grounds] }
  - { id: courts-or-clubs, nodes: [street-courts, club-grounds] }
  - { id: tv-deal, nodes: [free-to-air, pay-tv] }
  - { id: breaks, nodes: [broadcast-breaks, uninterrupted-play] }
  - { id: coverage, nodes: [star-coverage, club-coverage] }
  - { id: player-market, nodes: [draft, open-market] }
  - { id: league-size, nodes: [expansion, compact-league] }
  - { id: pay, nodes: [salary-cap, star-pay] }
  - { id: style, nodes: [attacking-style, defensive-style] }
  - { id: culture-way, nodes: [heritage, living-game] }
  - { id: reach, nodes: [local-pride, global-game] }

nodes:
  # Grassroots
  - id: backyard-clinics
    category: grassroots
    level: 1
    quarters: 0.6
    effects:
      - { type: casualConversion, amount: 0.05 }
  - id: weekend-leagues
    category: grassroots
    level: 2
    quarters: 0.6
    requires: [backyard-clinics]
    effects:
      - { type: formationThresholdReduction, amount: 0.12 }
  - id: word-of-mouth
    category: grassroots
    level: 3
    quarters: 0.8
    requires: [weekend-leagues]
    effects:
      - { type: spreadChannel, channel: proximity, amount: 0.12 }
  - id: cheap-gear
    category: grassroots
    level: 4
    quarters: 1.1
    requires: [word-of-mouth]
    effects:
      - { type: casualConversion, amount: 0.08, conditions: { wealth: -0.1 } }
      - { type: hardcoreConversion, amount: 0.04, conditions: { wealth: -0.08 } }
  - id: premium-gear
    category: grassroots
    level: 4
    quarters: 1.1
    requires: [word-of-mouth]
    effects:
      - { type: hardcoreConversion, amount: 0.06, conditions: { wealth: 0.08 } }
      - { type: sponsorValue, amount: 0.15 }
  - id: fan-meetups
    category: grassroots
    level: 5
    quarters: 1
    requiresAny: [cheap-gear, premium-gear]
    effects:
      - { type: churnReduction, amount: 0.04 }
  - id: coaching-badges
    category: grassroots
    level: 6
    quarters: 1.1
    requires: [fan-meetups]
    effects:
      - { type: hardcoreConversion, amount: 0.04 }
  - id: barnstorming-tours
    category: grassroots
    level: 7
    quarters: 1.2
    requires: [coaching-badges]
    effects:
      - { type: coldLaunchCostReduction, amount: 0.12 }
  - id: indoor-halls
    category: grassroots
    level: 8
    quarters: 1.6
    requires: [barnstorming-tours]
    effects:
      - { type: climateFit, amount: -0.5 }
      - { type: runningCostReduction, amount: -0.06 }
  - id: outdoor-grounds
    category: grassroots
    level: 8
    quarters: 1.6
    requires: [barnstorming-tours]
    effects:
      - { type: climateFit, amount: 0.3 }
      - { type: traditionBirth, traditionType: venue, amount: 0.3 }
  - id: school-programs
    category: grassroots
    level: 9
    quarters: 1.4
    requiresAny: [indoor-halls, outdoor-grounds]
    effects:
      - { type: casualConversion, amount: 0.05 }
  - id: border-tournaments
    category: grassroots
    level: 10
    quarters: 1.4
    requires: [school-programs]
    effects:
      - { type: spreadChannel, channel: proximity, amount: 0.12 }
  - id: volunteer-organizers
    category: grassroots
    level: 11
    quarters: 1.6
    requires: [border-tournaments]
    effects:
      - { type: churnReduction, amount: 0.04 }
  - id: street-courts
    category: grassroots
    level: 12
    quarters: 2.2
    requires: [volunteer-organizers]
    effects:
      - { type: casualConversion, amount: 0.12, conditions: { urbanDensity: 0.1, wealth: -0.1 } }
      - { type: hardcoreConversion, amount: -0.06 }
  - id: club-grounds
    category: grassroots
    level: 12
    quarters: 2.2
    requires: [volunteer-organizers]
    effects:
      - { type: hardcoreConversion, amount: 0.08, conditions: { wealth: 0.1 } }
      - { type: churnReduction, amount: 0.08 }
      - { type: casualConversion, amount: -0.04, conditions: { wealth: 0.05 } }

  # Media
  - id: local-radio
