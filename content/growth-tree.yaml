  - id: broadcast-breaks
    category: media
    level: 8
    quarters: 1.8
    requires: [star-profiles]
    effects:
      - { type: casualConversion, amount: 0.06, conditions: { mediaMarket: 0.08 } }
      - { type: mediaRevenue, amount: 0.15 }
      - { type: puristBacklash, amount: 0.03 }
  - id: uninterrupted-play
    category: media
    level: 8
    quarters: 1.8
    requires: [star-profiles]
