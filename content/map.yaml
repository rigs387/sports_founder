# Presentation settings; these do not change the simulation's balance.
heatBands: [0, 0.001, 0.01, 0.05, 0.15, 0.3]
establishedThreshold: 0.01
historyLimit: 160
labels: [united-states, brazil, france, nigeria, india, south-africa]
# The clock (GDD v1.24): Play / Pause over End Turn. Each speed is the time one simulated quarter
# takes on screen (the date ticks and the heat blends), slowest first; defaultSpeed indexes it.
# The clock pauses itself when a turn brings any of the interrupts, and always for a decision.
# A step (one turn while paused) replays at the current speed without blocking the player.
clock:
  quarterMs: [2000, 1000, 400]
  defaultSpeed: 1
  interrupts:
    - decision
    - offseason
    - tierChange
    - anchorHealth
    - focusHealth
    - focusRival
    - winHold
    - win
camera:
  minZoom: 0.65
  maxZoom: 7
  zoomStep: 1.3
  locateZoom: 2.5
  hitTargetPixels: 24
  smallMarketArea: 90
geometry:
  width: 1440
  height: 710
  scale: 248
  translate: [720, 355]
  precision: 0.3
  decimals: 2
  simplifyPercent: 15
  maxBytes: 500000
