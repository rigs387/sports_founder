# Balance config. Every tunable number lives in content files like this one, never in code.
#
# Formula shapes and the numbers below are Phase 0 tuning defaults, chosen so the genome, affinity
# and spread models produce explainable differences. Balance runs will move them.

calendar:
  # Present-day start (GDD Rival AI).
  startYear: 2026

start:
  # The founder's friends and family (GDD Starting state).
  anchorHardcoreFans: 40
  anchorCasualFans: 400
  startingPP: 10
  startingTier: 1

fandomScore:
  # Fandom Score = hardcore + casual × casualWeight. Also the outbound spread strength formula.
  casualWeight: 0.3

ppIncome:
  # Base PP per quarter = scale × (player Fandom Score ^ exponent). Exponent < 1 = diminishing
  # returns (GDD PP Income).
  scale: 0.05
  exponent: 0.5

# PP tier table (GDD Global PP Tier Track). Turn length is in quarters (1 = quarter, 2 = half-year,
# 4 = year).
#   fandomScoreRequired    Fandom Score needed to tier up into this tier
#   breadth                the tier's breadth condition, also what demotion is judged on:
#                            anchorLeagueTier     the anchor's league has reached leagueTier
#                            anchorHardcoreShare  the player's hardcore share of the anchor population
#                            leaguesOnContinents  leagues at leagueTier or above on this many continents
#                            globalRank           the player's sport ranks this high by Fandom Score
#                                                 among modeled sports (player + rivals)
#   focusSlots             focus slots held at this tier
#   backingSlots           flagship stars the player can back at this tier (GDD v1.16)
#   costMultiplier         scales PP costs ("growing pains"); the highest tier ever reached applies
#   mediaRevenueMultiplier PP tier caps the size of media and sponsor deals (GDD Business Layer)
ppTiers:
  - tier: 1
    fandomScoreRequired: 0
    breadth: { type: none }
    turnLengthQuarters: 1
    focusSlots: 1
    backingSlots: 1
    costMultiplier: 1
    mediaRevenueMultiplier: 1
  - tier: 2
    fandomScoreRequired: 10000
    breadth: { type: anchorLeagueTier, leagueTier: semi-pro }
    turnLengthQuarters: 1
    focusSlots: 2
    backingSlots: 1
    costMultiplier: 1.5
    mediaRevenueMultiplier: 1.25
  - tier: 3
    # Lowered from 1,500,000 (2026-09-17). The genome tuning in this pass cut both casual and
    # hardcore conversion, which pushed the tier-3 median to turn 69 against the GDD budget's turn
    # 50 (allowed 65). The score gate is what binds — the anchor-hardcore breadth gate is met at
    # turn 44 — so this is the pacing knob, and it pulls tiers 4 and 5 back toward their targets too.
    # Lowered again to 400,000 (2026-09-19): the steeper genome geography of step 7 slowed poorly
    # fitting genomes and put the tier-3 median at turn 61 of the 65 allowed; now 58.
    fandomScoreRequired: 400000
    breadth: { type: anchorHardcoreShare, share: 0.01 }
    turnLengthQuarters: 2
    focusSlots: 3
    backingSlots: 2
    costMultiplier: 2.5
    mediaRevenueMultiplier: 1.5
  - tier: 4
    fandomScoreRequired: 170000000
    breadth: { type: leaguesOnContinents, leagueTier: professional, continents: 3 }
    turnLengthQuarters: 2
    focusSlots: 4
    backingSlots: 2
    costMultiplier: 4
    mediaRevenueMultiplier: 2
  - tier: 5
    fandomScoreRequired: 1600000000
    breadth: { type: globalRank, rank: 3 }
    turnLengthQuarters: 4
    focusSlots: 5
    backingSlots: 3
    costMultiplier: 6
    mediaRevenueMultiplier: 2.5

# Tier-ups, demotion and cooldowns (GDD Global PP Tier Track).
tierTrack:
  # A tier-up is announced this many turns before it happens ("Approaching National Pastime") and
  # then happens regardless: tier-ups cannot be delayed or dodged.
  telegraphTurns: 1
  # At risk when the current tier's breadth progress, or Fandom Score relative to its threshold,
  # is below this share.
  demotionLine: 0.5
  # Demoted after this many consecutive turns at risk.
  demotionTurns: 4
  # No tier-up announcement, tier-up or demotion for this many turns after any tier change.
  cooldownTurns: 6

# Curves turning raw country figures into 0–1 scores (GDD Country attributes).
#   log:    score = (ln(x) − ln(low)) / (ln(high) − ln(low)), clamped to 0–1
#   linear: score = (x − low) / (high − low), clamped to 0–1
attributeCurves:
  # GNI per person, Atlas method, current US$ (World Bank). The real range runs from about 250
  # (Burundi) to about 140,000 (Bermuda); the curve saturates at both ends so the middle spreads.
  wealth: { type: log, low: 700, high: 80000 }
  # Share of the population living in urban areas. The real range runs from 0.15 to 1.
  urbanDensity: { type: linear, low: 0.15, high: 1.0 }
  # Media market size is the score of (population × wealth score). The real range runs from a few
  # thousand (Montserrat) to a few hundred million (United States, China, India).
  mediaMarket: { type: log, low: 200000, high: 200000000 }

# Lever multipliers: each starts at 1, the chosen options' deltas are added, then clamped.
levers:
  affinity: { min: 0.2, max: 2.0 }
  accessibility: { min: 0.3, max: 2.0 }
  depth: { min: 0.3, max: 2.0 }

# Rival similarity (GDD Sport Genome). Similarity to a country's dominant rival is the weighted
# share of axes on which the genomes match (0–1).
similarity:
  axisWeights:
    surface: 1.5
    equipment: 1.5
    physical: 1
    footprint: 0.5
    contact: 1
    teamSize: 0.5
    matchLength: 1
    scoring: 0.75
    complexity: 1
    structure: 1.25
  # Casual conversion × (1 + casualFamiliarityBonus × effective similarity): familiar is easier.
  # Trimmed for the real world (2026-09-17): soccer holds a meaningful share of nearly every one of
  # the 213 markets, so mimicking it paid almost everywhere and its traits (grass, simple rules) ran
  # above the dominance limit. Familiarity is worth less, crowding costs more.
  casualFamiliarityBonus: 0.3
  # Hardcore conversion × (1 − hardcoreCrowdingPenalty × effective similarity): they already
  # have that sport.
  hardcoreCrowdingPenalty: 0.5
  # A rival exerts its full similarity effect once its hardcore share of the country reaches
  # this; below it the effect scales down linearly (a sport nobody there follows is no rival).
  fullEffectHardcoreShare: 0.1

# Cross-border spread (GDD Spread Model). Only casual exposure crosses borders. A country's
# outbound strength is its Fandom Score (hardcore + weighted casual). Inbound exposure in the
# target = Σ over sources and channels of channelWeight × link × source strength / target
# population, so exposure is "the sport's following abroad, relative to your population".
spread:
  proximity:
    # Per neighbor link (land border or sea link).
    weight: 0.0085
  language:
    # Shared primary sphere. A link through either side's secondary sphere is scaled by
    # secondaryWeight (both secondary: squared). The real world's media spheres are wide - about 65
    # inbound language links per market, against 5 land or sea neighbours - so the per-link weight
    # is far below a neighbour's (retuned for the real dataset, 2026-09-16).
    weight: 0.00085
    secondaryWeight: 0.5
  media:
    # Between large media markets: weight × sourceMarket × targetMarket, only when both market
    # scores are at least minMarketScore. 64 of the 213 real markets clear the threshold, so each
    # link is worth much less than on the placeholder world (retuned 2026-09-16).
    weight: 0.0018
    minMarketScore: 0.5

# Exposure (per country, per quarter): what drives casual conversion and retention.
exposure:
  # Weight of the country's own following (Fandom Score / population): word of mouth.
  localWeight: 1.0
  # Exposure is capped here; beyond it more following does not convert faster. Together with
  # casualChurnRate this sets where a country's casual share levels off.
  cap: 0.06
  # Exposure at or above this counts as full retention for casual churn (see dynamics).
  retentionSaturation: 0.003

# Focus slots (GDD Spread Model). Focus boosts inbound spread and conversion.
focus:
  # Inbound spread into a focused country is multiplied by this.
  inboundMultiplier: 2.0
  # Casual and hardcore conversion in a focused country are multiplied by this.
  conversionMultiplier: 1.5
  # Direct outreach: a focused country gets exposure as if this many people followed the sport,
  # so a cold launch (zero exposure) still starts, slowly.
  outreachPeople: 3000
  # PP cost of assigning a slot to a country, times the tier's costMultiplier. Costs
  # coldLaunchCost with zero exposure, falling linearly to exposedCost as the country's exposure
  # (without focus) reaches costSaturationExposure.
  coldLaunchCost: 30
  exposedCost: 6
  costSaturationExposure: 0.005

# Quarterly fan dynamics. Rates are fractions per quarter.
dynamics:
  # Each flow is multiplied by a random factor in [1 - noise, 1 + noise].
  noise: 0.2
  player:
    # uninterested → casual: uninterested × rate × accessibility × affinity × familiarity
    #   × exposure × focus conversion bonus
    # Raised with the step 8 growth tree (2026-09-19, from 0.25 and 0.012; tuned to put the first win at the GDD's turn 180): a campaign now owns about
    # half the tree instead of all of it, so the sport needs more of its own growth to reach the
    # fixed bar of soccer's Fandom Score inside the GDD's turn budget.
    casualConversionRate: 0.27
    # casual → uninterested: casual × (churn + decay × (1 − exposure level)); exposure level is
    # exposure / exposure.retentionSaturation, capped at 1. Casuals decay without exposure.
    casualChurnRate: 0.04
    casualDecayRate: 0.06
    # casual → hardcore: casual × rate × depth × affinity × crowding × share of people with no
    # hardcore sport × focus conversion bonus
    hardcoreConversionRate: 0.0135
  # Rivals hold their ground (GDD Rival AI: rivals only drift slowly and react to the player). A
  # rival's real starting shares in a country (content/countries.yaml) are its home level: with no
  # spread and no affinity, its flows balance there, so left alone it stays where the data put it.
  # Rival defense countermoves (rivalAI below) boost these flows where a rival defends.
  #   uninterested → casual   uninterested × casualChurnRate × (home casual ÷ home uninterested)
  #                           × (1 + media blitz boost)
  #   casual → uninterested   casual × casualChurnRate (also how fast casual drifts back home)
  #   casual → hardcore       casual × hardcoreConversionRate × share of people with no hardcore
  #                           sport × (1 − hardcore ÷ home hardcore, never below 0)
  #                           × (1 + youth programs boost): only ground lost below home is rebuilt
  rival:
    # Raised from 0.01 (step 7, 2026-09-19): rival casual fans now return to home in a few years, so
    # a media blitz is a surge that fades rather than a permanent-looking level shift.
    casualChurnRate: 0.04
    hardcoreConversionRate: 0.001

# Hardcore poaching between sports (GDD Fan Model, v1.4: "Winning over rival hardcore fans is slow").
# One rule both ways. Each quarter, in each country, a sport's hardcore fans above the floor demote
# to casual about that same sport at
#   rate × Σ over pulling sports (strength × defense resistance)
#   strength = min(maxStrength, puller hardcore share of the population ÷ referenceShare)
# The player's sport pulls from every rival and from the "other sports" bucket; each rival pulls
# from the player's sport. Rivals do not pull from each other, and "other" never pulls. Demoted fans
# can then become hardcore about any sport through normal conversion. Hardcore fans never go
# straight to uninterested.
poaching:
  rate: 0.002
  referenceShare: 0.1
  maxStrength: 2
  # Poaching never takes a sport below this share of the country's population.
  floorShare: 0.0001
  # Multiplies the player's pull on a rival by the rival's escalation level in that country ("rival
  # defense slows the pull further"). The "other" bucket never defends: it always takes the full pull.
  defenseResistance: { none: 1, watching: 1, defending: 0.75, entrenched: 0.5 }

# Generational turnover (GDD Late-Game Pressure): every year a small share of the player's and every
# rival's hardcore fans ages out, in every country. The "other sports" bucket is exempt: it stands for
# unmodeled sports, never recruits, and would only erode (decided 2026-09-13).
# They demote to casual about the same sport (hardcore loss is demotion; nobody skips a bucket), and
# from there churn and decay carry them to uninterested unless exposure keeps them. Applied each
# quarter at 1 − (1 − annualRate)^(1/4), so a year compounds to annualRate. Turnover never takes a
# sport below floorShare of a country's population.
#
# rivalReplacement: each quarter a rival recruits this share of its aging hardcore fans back from its
# own casual fans, so an incumbent holds its ground unless the player wins fans from it (1 = every
# aging fan replaced). Poached fans are not replaced. The player gets no replacement.
turnover:
  annualRate: 0.04
  floorShare: 0.0001
  rivalReplacement: 1

# Rival defense (GDD Rival AI, Late-Game Pressure). Rivals defend; they don't hunt. Runs once per
# quarter, deterministic, no randomness.
rivalAI:
  # A rival escalates in a country only while it holds at least this hardcore share there.
  meaningfulHardcoreShare: 0.02
  # Pressure per rival per country = the player's hardcore gains there, as a share of the population
  # per year, smoothed: pressure ← pressure + smoothing × (annual gain share − pressure).
  pressureSmoothing: 0.25
  escalation:
    # Escalate one level when pressure reaches the next level's threshold ÷ intensity, after at
    # least minQuartersAtLevel at the current level.
    thresholds: { watching: 0.0005, defending: 0.002, entrenched: 0.006 }
    minQuartersAtLevel: 4
    # De-escalate one level after deescalationQuarters in a row with pressure below
    # (current level's threshold ÷ intensity) × deescalationRatio, or with the rival below the
    # meaningful share.
    deescalationRatio: 0.5
    deescalationQuarters: 8
  # All rivals defend harder as the player approaches global #1 (defending their position, not
  # hunting). ratio = player Fandom Score ÷ the best rival's; intensity rises linearly from 1 at
  # startRatio to maxIntensity at peakRatio and stays there beyond. peakRatio sits a little past 1
  # (step 7, 2026-09-19): a narrow lead draws the hardest defense, so #1 is contested until the
  # player pulls clear, instead of a flat defense the leader simply outgrows. Intensity divides the
  # escalation thresholds and multiplies budget income and movesPerQuarter (rounded down).
  nearTop:
    startRatio: 0.85
    peakRatio: 1.05
    maxIntensity: 4
    # Near #1 rivals defend their global position, not just where the player is gaining (step 7,
    # 2026-09-19: escalation keyed only to the player's gains fell away at the top as markets
    # filled). Pressure in a country is at least positionPressure × progress × the player's
    # hardcore share there, progress running from 0 at intensity 1 to 1 at maxIntensity.
    positionPressure: 0.05
  # Rivals fight hardest where it matters most (GDD v1.21): a market's value is
  # (population × its wealth level's defenseWeight ÷ referencePopulation) ^ exponent, clamped to
  # [min, max]. It divides the escalation thresholds there (on top of intensity), and among fronts
  # at the same level a rival spends first where its hardcore base × defenseWeight is biggest.
  marketValue: { referencePopulation: 50000000, exponent: 0.15, min: 0.67, max: 1.5 }
  # Hidden defense budget per rival: income per quarter = incomePerFandomScore × the rival's world
  # Fandom Score × intensity. Unspent budget is capped at capQuarters of income.
  budget:
    incomePerFandomScore: 0.000008
    capQuarters: 40
  # At most this many countermoves per rival per quarter, bought round-robin across the rival's
  # escalated countries (highest level first, then the rival's biggest hardcore base), trying
  # countermoves in preference order. A rival cannot spend more than its budget: when the most
  # preferred useful countermove in a country is beyond it, the rival saves up and buys nothing
  # more that quarter, rather than settling for a lesser one (step 7, 2026-09-19: cheap sponsor
  # lockouts were soaking up the budget its heartlands needed).
  movesPerQuarter: 1
  # Timed countermoves cost baseCost × (country population in millions) ^ costPopulationExponent:
  # bigger countries cost more to defend, but less than in proportion, so a rival can afford its
  # populous heartlands.
  costPopulationExponent: 0.5
  preference: [reclaim, youthPrograms, mediaBlitz, sponsorLockout, broadcastDeal, ruleCopying]
  # Closed countermove list. A countermove needs the rival to be at minLevel or above in that
  # country. Timed countermoves last durationQuarters and are not bought again while in effect there.
  countermoves:
    # Reclaim (GDD v1.17): rivals win ground back near #1. Bought only at or past
    # minNearTopProgress of the near-top ramp, where the rival is Entrenched and was the incumbent
    # (its home hardcore share is at least meaningfulHardcoreShare), and the player has hardcore
    # fans there. While it runs, sharePerQuarter of the player's hardcore fans there above the
    # turnover floor switch to the rival each quarter (× the growth tree's countermove factor).
    # Ground won above home ages away after it ends.
    reclaim: { minLevel: entrenched, baseCost: 2500, durationQuarters: 12, sharePerQuarter: 0.005, minNearTopProgress: 1 }
    # Rival casual conversion × (1 + casualConversionBoost) in that country.
    mediaBlitz: { minLevel: defending, baseCost: 1800, durationQuarters: 12, casualConversionBoost: 4 }
    # Rival hardcore conversion × (1 + hardcoreConversionBoost) in that country.
    # While they run, the rival also rebuilds toward home hardcore × (1 + homeLift): its countermoves
    # push it above home for a while (GDD v1.7), and that ground ages away after they end.
    youthPrograms: { minLevel: defending, baseCost: 3000, durationQuarters: 20, hardcoreConversionBoost: 10, homeLift: 0.3 }
    # Blocks the player's media reach spread channel into that country. Bought only while the
    # player has media reach exposure there, and never on top of another rival's deal.
    broadcastDeal: { minLevel: defending, baseCost: 3200, durationQuarters: 16 }
    # The player's league media and sponsor revenue there × (1 − mediaRevenueCut). Bought only
    # where the player has a league, and never on top of another rival's lockout.
    sponsorLockout: { minLevel: defending, baseCost: 1600, durationQuarters: 16, mediaRevenueCut: 0.5 }
    # The rival adopts one of the player's rule traits that is popular in that country: the rule
    # axis where the player's option has the highest positive net lever delta there (affinity +
    # accessibility + depth) above the rival's own option. Changes the rival's genome everywhere.
    # Costs a flat amount (it is one global rulebook change).
    ruleCopying: { minLevel: entrenched, cost: 30000, cooldownQuarters: 40 }
  # World championships (GDD v1.17), on each rival's real quadrennial cycle: soccer's in June–July
  # (from 2026), cricket's one-day championship in October–November (from 2027). From its start
  # quarter for `quarters` quarters the rival's casual and hardcore conversion in every country are
  # × (1 + boost) and the level it rebuilds toward is home × (1 + homeLift); that ground ages away
  # afterward. Stacks with the rival's own countermoves.
  tournaments:
    - { sportId: soccer, firstYear: 2026, everyYears: 4, startQuarterOfYear: 2, quarters: 4, casualConversionBoost: 0.12, hardcoreConversionBoost: 0.4, homeLift: 0.012 }
    - { sportId: cricket, firstYear: 2027, everyYears: 4, startQuarterOfYear: 4, quarters: 4, casualConversionBoost: 0.12, hardcoreConversionBoost: 0.4, homeLift: 0.012 }

# Anchor genome hints (GDD Campaign setup): an option's net lever delta at the anchor country
# (affinity + accessibility + depth) maps to ++ / + / − by these thresholds.
hints:
  plusPlus: 0.2
  plus: 0.05
  minus: -0.05

# No universal best option (GDD Sport Genome), checked against the real countries at load
# (decided 2026-09-14): each option's net lever delta (affinity + accessibility + depth) must be
# above neutralDelta in at least minHelpShare of countries and below −neutralDelta in at least
# minHurtShare of them. Not a literal law of design, a guard so every choice stays a trade-off.
genomeBalance:
  minHelpShare: 0.15
  minHurtShare: 0.15
  neutralDelta: 0.005

# Data sanity checks on the world, applied at load.
worldChecks:
  # A country's hardcore shares across every sport (rivals plus the "other sports" bucket) may not
  # exceed this. Hardcore is exclusive, so the remainder is the people with no hardcore sport: the
  # pool the player converts from. A market above this line is far more likely to be a bad figure
  # than a real place (decided 2026-09-15).
  maxSportCulture: 0.75

# Leagues (GDD League tiers, Business Layer Phase 0 subset, League Health Ladder). Cash is per
# country and never produces PP.
leagues:
  # Per tier: runningCost per quarter (before the wealth and size factors below), minRunningCost (a
  # floor on that result, so a tiny country's professional league still costs something), revenue
  # multiplier, and promotion INTO this tier: hardcore fans needed = max(minHardcore, hardcoreShare
  # × population), cash reserve needed and cash cost, both in quarters of this tier's running cost.
  # minHardcore keeps the fixed starting fan base from qualifying a tiny country for promotion
  # straight away (GDD: early collapse very unlikely). The shares were raised for the real dataset
  # (2026-09-16) to sit near the fans a tier's running cost actually needs: promotion is still a
  # stretch that can sink a league, but no longer one a league qualifies for at a sixth of the
  # revenue it will owe. The minRunningCost floors are what make a micro-market's professional
  # league unaffordable however saturated it is (GDD: a tiny anchor is fragile).
  tiers:
    amateur:
      runningCost: 0.4
      # Even a micro-market league has fixed overhead: without a floor, a 4,000-person market's
      # league costs almost nothing and can never fail (GDD: a minimum per league tier, and a tiny
      # anchor is fragile). Retuned for the real dataset, 2026-09-16.
      minRunningCost: 0.5
      revenueMultiplier: 1
      promotion: null
    semi-pro:
      runningCost: 6
      minRunningCost: 3
      revenueMultiplier: 1.5
      promotion: { hardcoreShare: 0.0012, minHardcore: 1500, reserveQuarters: 2.5, costQuarters: 2 }
    professional:
      runningCost: 40
      minRunningCost: 20
      revenueMultiplier: 2
      promotion: { hardcoreShare: 0.006, minHardcore: 3000, reserveQuarters: 2.5, costQuarters: 2 }
    elite:
      runningCost: 90
      minRunningCost: 60
      revenueMultiplier: 2.5
      promotion: { hardcoreShare: 0.02, minHardcore: 15000, reserveQuarters: 2.5, costQuarters: 2 }
  formation:
    # An Amateur league forms once player hardcore fans reach max(minHardcore, share × population).
    minHardcore: 300
    hardcoreShare: 0.0005
    # A new league starts with this many quarters of Amateur running cost in cash. Cut from 60
    # (2026-09-19): step 8's faster conversion had fans paying for the league before the grant ran
    # out, and Hungary stopped ever collapsing under the naive bot.
    startingCashQuarters: 48
    # After a league folds, a new one cannot form for this many quarters.
    reformCooldownQuarters: 8
  # Running cost per quarter = max(tier minRunningCost, tier runningCost × (wealthFloor + (1 −
  #   wealthFloor) × wealth score) × (population ÷ referencePopulation) ^ populationExponent)
  #   × the growth tree's running cost factor in that country
  costs:
    wealthFloor: 0.3
    referencePopulation: 1000000
    populationExponent: 1
  # Revenue per quarter, × the league tier's revenueMultiplier:
  #   gate  = hardcore × gatePerHardcore × (wealthFloor + (1 − wealthFloor) × wealth score)
  #   media = casual × mediaPerCasual × (mediaMarketFloor + (1 − floor) × media market score)
  #           × the PP tier's mediaRevenueMultiplier
  revenue:
    gatePerHardcore: 0.001
    mediaPerCasual: 0.00005
    wealthFloor: 0.3
    mediaMarketFloor: 0.3
  # Health is evaluated once per turn and moves at most one step. The target rung comes from:
  #   cash below zero                          → collapse (needs a full turn at Near-Collapse first)
  #   losing cash with runway < near-collapse  → Near-Collapse
  #   losing cash with runway < struggling     → Struggling
  #   losing cash and the loss is growing      → one rung worse
  #   hardcore fans falling faster than rate   → one rung worse (per quarter, relative)
  # Runway = cash ÷ cash lost per quarter. Each step down demotes this share of hardcore to casual.
  health:
    strugglingRunwayQuarters: 12
    nearCollapseRunwayQuarters: 4
    hardcoreFallingRate: 0.002
    demotionShare:
      struggling: 0.02
      near-collapse: 0.05
      collapsed: 0.25
  # Voluntary step-down at Near-Collapse: one tier down, reset to Struggling, demote this share.
  stepDown:
    hardcoreDemotionShare: 0.05
  # PP bailout: costs ppCost × the PP cost multiplier, grants cashQuarters of the league's running
  # cost, then cannot be used on that league again for cooldownQuarters.
  bailout:
    ppCost: 25
    cashQuarters: 8
    cooldownQuarters: 16

# The flagship season ends in this quarter of the year, and the offseason opens (GDD v1.24): league
# business happens in it, once a year. It stays open from the season's end until the next turn ends,
# so the player meets it at the start of the first turn after the season; closing it applies a seat
# move and starts the next season.
offseason:
  seasonEndQuarter: 3

# A giant market is many audiences (GDD v1.21): tastes vary inside India or China, so no rulebook
# suits them strongly. Genome fit in a country (every option's lever deltas) is
# × min(1, (referencePopulation ÷ population) ^ fitExponent), never below minScale. Giants are won
# by breadth and patience; fit is sharpest in mid-sized and small markets. Content validation of
# genome balance reads the unsoftened deltas.
bigMarkets:
  referencePopulation: 50000000
  fitExponent: 0.3
  minScale: 0.3

# Wealth levels (GDD v1.21), named for what fans can spend on sport. countries.yaml's income per
# person is GNI per capita (World Bank Atlas method, 2024), the measure the World Bank classifies by,
# so these are its FY2026 income-group thresholds (US$): low ≤ 1,135, lower-middle ≤ 4,495,
# upper-middle ≤ 13,935, high above. Prestige income counts each market's Fandom Score × ppWeight;
# rivals weigh their defense there by population × defenseWeight. The race for #1 counts raw fans.
wealthLevels:
  thresholds: [1136, 4496, 13936]
  levels:
    - { id: shoestring, ppWeight: 0.5, defenseWeight: 0.5 }
    - { id: modest, ppWeight: 0.75, defenseWeight: 0.75 }
    - { id: comfortable, ppWeight: 1, defenseWeight: 1 }
    - { id: affluent, ppWeight: 1.5, defenseWeight: 1.5 }

# Rules evolution, first build (GDD v1.20). In the seasonal window the player may amend one rule
# trait a year to any of its options. The jump is the number of steps between the options, or
# fixedJump for traits whose options have no order. Price = basePrice × the peak tier's cost
# multiplier × jump. Purist backlash: in every country a share of the player's hardcore fans turn
# casual: sharePerJump × jump × min(1, the rule's age in years ÷ fullAgeYears), × anchorFactor in
# the anchor, × (1 + fitWeight × how much the new option's net lever delta there falls short of the
# old one's), capped at maxShare. Purists remember the founding rules (decided 2026-10-04): the
# share is also × (1 + driftWeight × steps from the trait's founding rule to the new one), and
# × returnFactor for a move back toward it, so sports keep their founding identity (without it
# every sport amended toward the same rulebook and the differentiation experiment failed). A
# review shows fit hints for the anchor and previewMarkets more.
rulesEvolution:
  basePrice: 100
  fixedJump: { structure: 2 }
  backlash:
    sharePerJump: 0.03
    fullAgeYears: 40
    anchorFactor: 2
    fitWeight: 2
    driftWeight: 1.5
    returnFactor: 0.5
    maxShare: 0.25
  previewMarkets: 5

# Culture, first build (GDD v1.22). Traditions are born only from recorded facts, held by the
# player's fans in follower countries, renewed by new facts and faded without them. Founding
# character's multipliers live in identity.yaml; names in names.yaml.
culture:
  # Strength runs 0-1: born at startStrength × the birthplace's ease (honored star legacies add
  # honorsBonus), + renewal per renewing fact, − decayPerYear for each year without one. Lost at 0.
  startStrength: 0.5
  renewal: 0.25
  decayPerYear: 0.05
  honorsBonus: 0.2
  # Births. Thresholds are divided by the birthplace's ease for the type and rounded (at least 1).
  # Facts count only from culture.startSeason (no retroactive history for older saves).
  derby: { meetings: 3, seasons: 5 }
  legacy: { starSeasons: 4 }
  venue: { fameFacts: 3, foundingFacts: 1 }
  # Effects. A country's weight is the strength its traditions hold there (abroad at
  # reach.followerShare), capped; each effect scales with weight ÷ weightCap at most.
  weightCap: 2
  turnoverCut: 0.33
  poachCut: 0.4
  # Famous venue extras: casual conversion × (1 + pilgrimage × strength) in its country; the
  # champion moment's PP × (1 + championBonus × the flagship country's venue strength, at most 1).
  pilgrimage: 0.05
  championBonus: 0.5
  # Betrayal. Amendment backlash × (1 + backlashWeight × ethos × offended strength held there);
  # an offending amendment cuts the tradition's strength by amendmentDamage × jump. The seat move's
  # purist cost × (1 + seatWeight × ethos × weight of the country left). Renaming the trophy turns
  # renameShare × strength × ethos of its followers' hardcore fans casual.
  backlashWeight: 1
  amendmentDamage: 0.25
  seatWeight: 0.5
  renameShare: 0.03
  # Reach (Culture nodes only): once a year a tradition at minStrength or more at home may gain a
  # follower: chance = chancePerReach × the reach bonus (zero without reach nodes). A candidate is
  # linked to a follower by proximity or language and has a player hardcore share of at least
  # minHardcoreShare.
  reach: { minStrength: 0.9, chancePerReach: 1, followerShare: 0.5, minHardcoreShare: 0.001 }
  # The birth moment's PP by type (the loss moment pays nothing).
  birthPP: { derby: 6, rite: 8, legacy: 6, nationalName: 6, venue: 6, trophy: 4 }
  # Content validation: each birthplace's eases and each ethos's betrayal multipliers must have a
  # geometric mean within 1 ± characterBand (character changes a campaign's shape, not difficulty).
  characterBand: 0.1

# Sport identity (GDD v1.18): limits on the names typed at setup (the sport, the founding club's
# name and its ground), counted after trimming.
identity:
  nameMinLength: 2
  sportNameMaxLength: 24
  clubNameMaxLength: 20
  groundNameMaxLength: 32
  # The trophy's name (GDD v1.22), given on the first champion card or in a rename.
  trophyNameMaxLength: 32

# The flagship league (GDD v1.11 commissioner's seat, v1.14 flagship season). The player runs one
# league in depth: named clubs, a season a year that ends in the seasonal window, a champion. Its
# matches roll on their own random stream, so the world's random sequence (fans, spread, rivals)
# is the same whether or not the flagship plays.
flagship:
  # Clubs by the flagship league's tier. Promotion admits generated expansion clubs at the next
  # season start; a step-down drops the newest clubs.
  clubs: { amateur: 8, semi-pro: 12, professional: 16, elite: 20 }
  # American format: the playoff field is the entry with the largest minClubs the league reaches.
  # Single-match knockouts, higher seed at home.
  playoffs:
    - { minClubs: 8, clubs: 4 }
    - { minClubs: 12, clubs: 8 }
  points: { win: 3, draw: 1 }
  # A match: each side gets `chances` scoring rolls, each scoring with probability
  #   clamp(baseRate + ratingEffect × (own rating − opponent rating ± homeAdvantage ÷ 2),
  #         minRate, maxRate)
  # so a draw is possible. A drawn playoff is settled by deciders (one roll each) until one side
  # scores alone; after maxDeciders, the higher seed goes through.
  # chances, baseRate and ratingEffect are by the genome's scoring frequency (GDD v1.16), fixed for
  # a season at its start. Medium is the pre-v1.16 rule. Low and high were fitted (exact binomial
  # odds, tests/flagship-match.test.ts) so the stronger club wins about as often at every rating
  # gap; low draws more and the weaker club wins less, high draws less and upsets more.
  match:
    chances: { low: 3, medium: 6, high: 14 }
    baseRate: { low: 0.4, medium: 0.3, high: 0.3 }
    ratingEffect: { low: 0.013, medium: 0.008, high: 0.0047 }
    homeAdvantage: 4
    minRate: 0.05
    maxRate: 0.8
    maxDeciders: 10
  # Club ratings. Start at start ± startSpread. At each season's end every rating moves by
  #   uniform(−drift, drift) + reversion × (league mean − rating)
  #   + financePull × (healthTarget[league health] − league mean)
  # and is clamped to [min, max]: dynasties form and fade, and a struggling league plays worse.
  # An expansion club starts expansionPenalty below the league mean.
  rating:
    start: 50
    startSpread: 8
    min: 1
    max: 100
    drift: 6
    reversion: 0.15
    financePull: 0.2
    healthTarget: { healthy: 50, struggling: 44, near-collapse: 38 }
    expansionPenalty: 5
  # A new club is based in one of its market's real places (places.yaml), drawn with weight
  # population ^ placeWeightExponent: big cities host several clubs, small towns sometimes one.
  placeWeightExponent: 0.5
  # Leading players (GDD v1.16, tech plan 2.6 step 2): one named player per club, born in a real
  # place of the club's market (drawn as club places are), named from the market's pool in
  # names.yaml. Every active club without one gets one when clubs are fitted to the league (a
  # founding or expansion club, or an old save's club). Ages at founding are spread
  # foundingAge.min..max so the first generation does not retire at once. Skill is hidden: peak
  # skill is uniform mean ± spread, clamped to skill.min..max; current skill is peak × the career
  # curve, which climbs risePerYear (as a share of peak) each year below peakAge, holds to
  # declineAge and falls declinePerYear each year after. A drawn name already in the league is
  # redrawn up to nameRetries times. Every name pool needs at least minNamePool given and family
  # names.
  # Credit (step 3): each of a club's scores goes to its leading player with probability
  #   clamp(base + perSkill × (skill − pivot), min, max)
  # and to the squad otherwise; deciders are not scores. Each season's tallies become a career
  # line. A player at skill 50 takes about a quarter of the club's scores, one at 70 about 37%.
  players:
    foundingAge: { min: 18, max: 32 }
    skill: { min: 1, max: 100 }
    peakSkill: { mean: 50, spread: 20 }
    career: { peakAge: 27, declineAge: 30, risePerYear: 0.04, declinePerYear: 0.05, wobble: 3 }
    # Careers (step 4). At every season's end each playing leading player's skill becomes
    # peak × the career curve for next season's age ± up to career.wobble. A player who played
    # their final season retires; then, from finalSeason.fromAge, next season becomes a player's
    # final season with chance base + perYear × (age − fromAge) + perLostShare × the share of peak
    # skill lost, and always at lastAge. A retired player's club gets a young replacement (age
    # replacement.age) whose peak skill leans toward the club's strength: + ratingLean × (club
    # rating − rating.start).
    finalSeason: { fromAge: 31, base: 0.1, perYear: 0.12, perLostShare: 0.5, lastAge: 37 }
    replacement: { age: { min: 17, max: 20 }, ratingLean: 0.4 }
    nameRetries: 10
    minNamePool: 20
    credit: { base: 0.25, perSkill: 0.006, pivot: 50, min: 0.05, max: 0.6 }
  # Stars (GDD v1.16, tech plan 2.6 step 4). At a season's end its top scorer becomes a star if
  # they took at least share[the season's scoring frequency] of their club's scores (playoffs
  # included) and the league has an open place (places by its tier; stars at dormant clubs do not
  # count). A star stays a star until retirement. A star adds strengthPerSkill × skill to their
  # club's rating in matches. Each season's end, a star not in their final season moves with
  # chance moveChance to a club rated above theirs that has no star; the clubs swap leading
  # players.
  # share is by scoring frequency because few scores make shares swing more (measured 2026-10-03,
  # flagship only, Brazil, 16 seeds × 40 seasons): a single 35% bar made stars in 13% of
  # low-scoring Amateur seasons and 10% of high-scoring ones, with the first star in season 1–2.
  # These bars make stars in 9–10% of Amateur seasons at every frequency (Professional: low 10%,
  # medium 17%, high 16%), the first star at median season 5 / 2 / 5, and half fill the Amateur
  # star place. Stars lift runaway and foregone-league stories by a few points.
  stars:
    share: { low: 0.44, medium: 0.39, high: 0.37 }
    places: { amateur: 1, semi-pro: 2, professional: 3, elite: 4 }
    strengthPerSkill: 0.08
    moveChance: 0.25
    # Star cards (step 6). The breakout moment's PP by league tier (it takes no moment slot).
    # Keeping a backed star from moving costs keepCashQuarters × the flagship league's running
    # cost in league cash. Mentoring: the succession card names last season's top-scoring
    # leading player who is no star, unbacked and younger than mentorMaxAge; they get
    # mentorCreditLift on their credit chance through the mentor's final season, then take the
    # slot with mentorShare of the mentor's influence. Honors: a retired star's influence fades by
    # 1 ÷ afterglowSeasons each season's end instead of stopping. Dropping a star at full
    # influence demotes dropDemotionShare of the player's hardcore fans in the flagship country.
    # A new all-time top scorer of a league is a record once it has played recordMinSeasons.
    breakoutPP: { amateur: 3, semi-pro: 5, professional: 8, elite: 12 }
    keepCashQuarters: 4
    mentorMaxAge: 24
    mentorCreditLift: 0.1
    mentorShare: 0.5
    afterglowSeasons: 3
    dropDemotionShare: 0.01
    recordMinSeasons: 5
  # Backing stars (GDD v1.16, tech plan 2.6 step 5). In the seasonal window the player may back a
  # star playing at the seat, one per backing slot (ppTiers), for a one-time basePrice × the peak
  # tier's cost multiplier in PP, with no upkeep; or drop one. A backed star's influence starts at
  # 0 and grows by 1 ÷ influenceSeasons at each season's end they played at the seat, to 1.
  # Dropping resets it; retiring ends the backing. Each backed star playing at the seat
  # multiplies casual conversion in the flagship country by (1 + casualConversion × influence)
  # and media reach out of it by (1 + mediaReach × influence); off the seat both pause.
  backing:
    basePrice: 60
    influenceSeasons: 4
    casualConversion: 0.15
    mediaReach: 0.3
  # The seat moves only to these league tiers (GDD v1.13); the anchor holds it from turn 1 at any
  # tier.
  seatEligibleTiers: [professional, elite]
  # The purist cost of moving the seat (GDD v1.14): this share of the player's hardcore fans in
  # the country the seat leaves demote to casual, more when it leaves the anchor.
  seatMove:
    hardcoreDemotionShare: 0.03
    anchorHardcoreDemotionShare: 0.08
  # The flagship season as cards (GDD v1.15). Read from the recorded season summary only.
  stories:
    # The champion moment's PP, by the flagship league's tier when the card arrives.
    championPP: { amateur: 4, semi-pro: 6, professional: 10, elite: 15 }
    # One step of the clubRating effect, in rating points (ratings run rating.min..rating.max).
    ratingStep: 3
    # Dynasty: the same club's dynastyTitles-th straight title. Foregone league: foregoneTitles or
    # more in a row (replaces dynasty).
    dynastyTitles: 3
    foregoneTitles: 4
    # Runaway: the champion tops the table by at least runawayShare × matches per club × points
    # for a win (American format: the playoff champion also topped the table by that gap).
    runawayShare: 0.15
    # Close finish. European: the top two within closeFinishWins × points for a win. American: the
    # final won by closeFinalMargin or less (by the season's scoring frequency), or settled by
    # deciders. Measured 2026-10-03 (flagship only, Brazil, 5 seeds × 200 seasons per cell):
    # with a margin of 1 everywhere the close-finish rate was low 75%, medium 62%, high 41–43%;
    # a margin of 2 for high gives 64–65%. Low stays at 1: low-scoring sports decide more finals
    # by one score (GDD v1.16). European rates and runaway stayed within a few points.
    closeFinishWins: 1
    closeFinalMargin: { low: 1, medium: 1, high: 2 }
    # Underdog: the champion was among the weakest floor(clubs ÷ underdogDivisor) clubs by rating
    # when the season began.
    underdogDivisor: 3
  # The flagship's broadcast (GDD v1.23, tech plan 2.12). While a league holds the seat, media
  # reach out of its country is multiplied by
  #   1 + ceiling[league tier] × interest[last season] × health[league health] + pulse
  # Interest is read from the last finished season at the seat with the story thresholds above:
  # runaway (a runaway or a foregone league), dynasty, gripping (a close finish, a first title or
  # an underdog champion) or ordinary, in that order; a seat with no finished season is ordinary.
  # The pulse at a season's end is ceiling × pulse.size × pulse.story[last season] × health,
  # fading linearly to nothing over pulse.fadeQuarters. At Near-Collapse every country the seat's
  # media reaches loses rippleShare of the player's casual fans a quarter (extra casual churn) ×
  # its media link from the seat ÷ the strongest; the seat pays through its own league. It
  # multiplies with backed stars on the same channel.
  broadcast:
    ceiling: { amateur: 0.05, semi-pro: 0.07, professional: 0.1, elite: 0.16 }
    interest: { gripping: 1, ordinary: 0.7, dynasty: 0.5, runaway: 0.25 }
    health: { healthy: 1, struggling: 0.5, near-collapse: 0 }
    pulse:
      size: 1
      fadeQuarters: 4
      story: { gripping: 1.5, ordinary: 1, dynasty: 1, runaway: 0 }
    rippleShare: 0.005
  # Flagship deals (GDD v1.28, tech plan 2.15). Only the flagship signs deals; other leagues keep
  # the combined media line. Without deals the flagship keeps baselineShare of that line; each
  # signed deal pays its annual value, locked at signing, a quarter at a time. Each offseason every
  # open slot gets offersPerSlot offers on the flagship's own random stream: one TV slot, sponsor
  # slots by league tier (the first is the main sponsor, where the homegrown gear brand always
  # offers), and a naming-rights slot for the founding ground and each famous ground. Values are
  # starting points, tuned so a full slate of ordinary offers is 100–120% of the media line it
  # replaces (balanceTargets.dealSlateShare).
  deals:
    baselineShare: 0.4
    sponsorSlots: { amateur: 1, semi-pro: 1, professional: 2, elite: 3 }
    offersPerSlot: { min: 2, max: 3 }
    seasons: { min: 1, max: 5 }
    value:
      tvPerCasual: 0.00003
      sponsorPerFan: 0.000008
      namingPerHardcore: 0.0002
      sponsorSlotShares: [ 0.5, 0.3, 0.2 ]
      spread: 0.15
    # A sport's PP tier caps what partners will pay (GDD: sponsors take a maturing sport seriously).
    capByPpTier: [ 0.6, 0.8, 1, 1.3, 1.6 ]
    demands:
      tierFloor: { chance: 0.15, premium: 0.3 }
      seatLock: { chance: 0.15, premium: 0.4 }
      exclusivity: { chance: 0.25, premium: 0.5 }
      ruleChange: { premium: 0.6 }
    tierFloorMinTier: semi-pro
    # Rule demands are rare and never required: every slot always has an offer without one.
    ruleDemand:
      chancePerOffseason: 0.2
      dueOffseasons: 2
      wishes:
        tv:
          - { axis: matchLength, toward: short }
          - { axis: scoring, toward: high }
          - { axis: structure, toward: continuous }
        sponsor:
          - { axis: contact, toward: none }
          - { axis: complexity, toward: simple }
    breach: { penaltySeasons: 1, shunSeasons: 3 }
    renewalEdge: 0.1
    gearBrand: { valueShare: 0.6, renewalEdge: 0.25 }
    # Pay-TV owners get bigger TV offers, exclusive twice as often; Free-to-Air owners smaller,
    # never exclusive.
    tvFork:
      pay-tv-exclusivity: { value: 1.2, exclusivityChance: 2 }
      free-to-air: { value: 0.85, exclusivityChance: 0 }
    exclusivityLiftCut: 0.5
    sponsorLockout: { value: 0.6, offersCut: 1 }
    namingRights: { hardcoreDemotionShare: 0.02, traditionWear: 0.2, pilgrimageCut: 0.5 }

# Win condition (GDD Win condition, Post-win play): the player's sport wins by ending holdTurns
# turns in a row as #1 by global Fandom Score among modeled sports (player + rivals; the "other"
# bucket is not a sport) while at PP tier requiredTier or above (decided 2026-09-18: a Backyard Game
# cannot be the world's sport). A turn short of either starts the hold again. Winning never ends the
# campaign; after it, an anchor collapse is a Moment instead of the end.
#
# holdTurns and the rivals' near-top defense (rivalAI.nearTop) set when the first win lands. Since
# step 7 (2026-09-19) the hold is a contest: rivals push back hardest just past parity, and about
# half the campaigns that take #1 lose it at least once before winning (43% of 89 on typical
# anchors, builder). Lowered from 36 to 30 to keep the median first win near the GDD's turn 180
# (measured 203, allowed up to 234); a shorter hold cut the contest more than it helped pacing.
# Tier 5 turns are years, so the hold is about 30 years.
win:
  holdTurns: 30
  requiredTier: 5

# Headless balance targets (tech plan 2.1 exit criteria). Read by the runner only.
balanceTargets:
  # Contrasting genomes share fewer than this share of their top-N countries by population share.
  differentiationTopN: 10
  differentiationSharedShare: 0.5
  # No single trait option appears in more than this share of top-quartile runs.
  dominanceLimit: 0.4
  # Beyond sampling noise (decided 2026-09-14): an option or growth node fails only when the one-sided
  # lower confidence bound of its top-quartile share (Wilson, z 1.645 = 95%) is above the limit, and
  # the options experiment plays this many random genomes per anchor (or --campaigns if higher). With
  # 10 per anchor a perfectly balanced genome shows ~6 options above 40% by chance.
  # Cut from 250 to 40 (2026-10-03): runs must finish in minutes. The confidence bound keeps a
  # smaller sample from flagging noise; it only catches the clearer cases of dominance.
  dominanceZ: 1.645
  optionsGenomesPerAnchor: 40
  # Turns spent in each PP tier (GDD campaign length table), and the allowed deviation.
  # Backyard Game ~40 turns and Local Curiosity ~10 (decided 2026-09-14). The last entry is the
  # turns spent in the top tier until the first win: ~180 turns to the first win in all.
  turnsInTier: [ 40, 10, 40, 40, 50 ]
  pacingTolerance: 0.3
  # Pacing targets are for a typical anchor (decided 2026-09-13): the pacing experiment's default
  # anchors are the countries whose population lies between these quantiles of all countries. Tiny
  # and huge anchors are harder by design (anchor size is the main difficulty lever).
  pacingAnchorPopulationQuantiles: [ 0.25, 0.75 ]
  # Collapses on or before this turn are reported separately: they should be very rare.
  earlyCollapseTurn: 20
  # Experiments that sweep anchors use a deterministic sample of this many markets, spread evenly
  # across the population range, instead of all 213 (decided 2026-09-15). There is no all-markets
  # option. Spread beats repetition (2026-10-03): 5 anchors read the win contest at 19% where 12
  # read 36%, so keep 12 anchors and cut seeds instead (the runner defaults to 5 per anchor).
  experimentAnchors: 12
  # The signature hard anchor for the "hard anchors are winnable" criterion (GDD Map and markets).
  hardAnchor: tuvalu
  # The flagship broadcast's share of the player's world media reach exposure (GDD v1.23): the
  # population-weighted media exposure the broadcast and pulse add, ÷ all media exposure, averaged
  # over a campaign's turns (each over its quarters). Judged on campaigns whose seat is in a large
  # media market; a seat in a small one reaches nowhere by design. The map stays the game: the
  # flagship helps, it does not carry.
  flagshipBroadcastShare: [ 0.05, 0.15 ]
  # Flagship deals (GDD v1.28): a full slate of ordinary offers (no demands) at each league tier,
  # as a share of the media line it replaces. Going without hurts; signing everything does not make
  # the flagship unsinkable.
  dealSlateShare: [ 1, 1.2 ]
  # Growth node dominance is judged strategy by strategy (decided 2026-09-21). One bot answers the
  # tree the same way every time, so the nodes it always buys read as dominant when they are only
  # that bot's signature: builder takes the grassroots spine, media-rush the media branch,
  # anchor-turtle street courts and community ownership. A node fails only when every one of these
  # bots owns it in more than dominanceLimit of its own top-quartile runs - a node no strategy can
  # pass up. Each extra bot plays this many random genomes per anchor.
  nodeDominanceBots: [ builder, media-rush, anchor-turtle, greedy-spread ]
  nodeDominanceGenomesPerBot: 15
  # The naive strategy for the "no safe anchor" criterion.
  naiveBot: greedy-spread
  # Seeds per anchor for the naive bot in the collapse experiment (or --campaigns if higher). Rare
  # collapses need many seeds: an anchor collapsing 12% of the time shows 0/15 about 15% of the time.
  # Cut from 50 to 15 (2026-10-03) to keep the run to minutes; a 0/15 anchor is a lead to follow up
  # with a targeted run, not a verdict.
  naiveBotCollapseSeeds: 15
