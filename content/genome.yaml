# Sport genome content (GDD Sport Genome). The axes and options themselves are fixed by design and
# declared in src/content/genome-axes.ts; this file must list every one of them, and carries every
# tunable number: each option's lever modifiers and its conditions on country attributes.
#
# Three levers per option, each a delta added to a multiplier that starts at 1 (see config.yaml
# `levers` for the clamps):
#   affinity       multiplies both casual and hardcore conversion ("does this sport fit here?")
#   accessibility  multiplies casual conversion (uninterested → casual)
#   depth          multiplies hardcore conversion (casual → hardcore)
#
# An option's `base` accessibility and depth deltas always sum to zero (decided 2026-09-21): base
# says what kind of sport an option makes - wide and shallow, or narrow and deep - never how good it
# is. Level, not geography, is what a dominance run measures, so an option that carries free level
# wins everywhere and the tuning never converges. Most of the props removed on 2026-09-21 had been
# propping up options that climate was crippling (ice +0.15, long +0.12, continuous +0.09), and the
# matching trims had been holding down whichever option was winning because of it (short -0.07,
# stop-start -0.04). Use runs/level-bases.mjs after editing a base delta.
#
# Each option has `base` deltas (apply everywhere) and `conditions` on country attributes:
#   climate: { cold: +0.4, tropical: -0.45 }     categorical: the listed delta applies in that zone,
#                                                 less the map's population-weighted world mean, so
#                                                 an option's climate map averages out to nothing
#                                                 across the world (decided 2026-09-21; centred at
#                                                 load in src/content/derive.ts). Write the zones
#                                                 relative to each other: only the differences
#                                                 between them reach the simulation. A climate
#                                                 condition says where a sport does better, never
#                                                 whether it thrives at all.
#   wealth: +0.1                                  numeric, relative to the world: +0.1 in the most
#                                                 extreme country above the population-weighted world
#                                                 average, −0.1 in the most extreme below it, nothing
#                                                 at the average (linear in between)
# Numeric attributes: wealth, urbanDensity, sportCulture, mediaMarket.
#
# Every condition delta was scaled ×1.75 on 2026-09-18 (base deltas untouched). Once rivals hold
# their ground at the real data, rival-thin rich and urban markets saturated for every genome by the
# late game and differentiation fell to 3/6 pairs; steeper geography brings it back to 6/6 without
# shrinking total growth (pacing still passes; first win median turn 184).
# Scaled ×1.25 again on 2026-09-19 (×2.19 in all): the contested win hold has rivals defending their
# heartlands hardest in the late game, which pushed every genome back toward the same rival-thin
# markets (backyard-kickball vs street-court reached 5.0 shared). ×1.25 is the most that fits: ice's
# cold-climate affinity is at 1.97 of the lever limit of 2.
#
# Design rule (GDD "No universal best option"): every option must help in, and hurt in, a real share
# of the actual countries (config genomeBalance). Content validation refuses one that does not.

options:
  surface:
    grass:
      base: { depth: 0.0 }
      conditions:
        affinity:
          # Trimmed 2026-09-19 (temperate 0.329, tropical 0.11): after the step 7 steepening grass
          # helped in most of the world's population and ran at 52% of top-quartile runs.
          climate: { temperate: 0.28, tropical: 0, cold: -0.329, arid: -0.438 }
        accessibility:
          urbanDensity: -0.438
    indoor:
      base: { depth: 0 }
      conditions:
        affinity:
          climate: { cold: 0.219, arid: 0.11, tropical: 0, temperate: -0.219 }
        accessibility:
          wealth: 0.11
          urbanDensity: 0.11
    street:
      base: { accessibility: 0.06, depth: -0.06 }
      conditions:
        affinity:
          climate: { cold: -0.329, arid: -0.11 }
        accessibility:
          urbanDensity: 0.548
          wealth: -0.438
    ice:
      base: { depth: 0.075, accessibility: -0.075 }
      conditions:
        affinity:
          climate: { cold: 1.969, temperate: 0.11, arid: -0.656, tropical: -0.765 }
        accessibility:
          wealth: 0.329

  equipment:
    ball-only:
      base: { accessibility: 0.06, depth: -0.06 }
      conditions:
        accessibility:
          wealth: -0.329
        affinity:
          sportCulture: -0.11
    stick-or-bat:
      base: { accessibility: -0.04, depth: 0.04 }
      conditions:
        accessibility:
          wealth: 0.329
    protective-gear:
      base: { accessibility: -0.04, depth: 0.04 }
      conditions:
        accessibility:
          wealth: 0.329
        affinity:
          sportCulture: 0.11

  physical:
    speed:
      base: { accessibility: 0.035, depth: -0.035 }
      conditions:
        affinity:
          climate: { tropical: 0.11, arid: 0.11, cold: -0.219 }
        accessibility:
          urbanDensity: 0.11
    strength:
      base: { depth: 0.035, accessibility: -0.035 }
      conditions:
        affinity:
          climate: { cold: 0.548, temperate: 0.11, tropical: -0.329, arid: -0.11 }
        accessibility:
          sportCulture: 0.329
    precision:
      base: { accessibility: -0.015, depth: 0.015 }
      conditions:
        affinity:
          wealth: 0.11
          climate: { arid: 0.219 }
    endurance:
      base: { accessibility: 0.01, depth: -0.01 }
      conditions:
        affinity:
          climate: { temperate: 0.329, cold: 0.11, tropical: -0.219, arid: -0.11 }
          wealth: -0.219
          urbanDensity: -0.175

  footprint:
    small:
      base: { accessibility: 0.04, depth: -0.04 }
      conditions:
        accessibility:
          urbanDensity: 0.438
    medium:
      base: {}
      conditions:
        accessibility:
          urbanDensity: -0.219
        depth:
          wealth: 0.219
    large:
      base: { accessibility: -0.025, depth: 0.025 }
      conditions:
        accessibility:
          urbanDensity: -0.548
        affinity:
          climate: { temperate: 0.11, arid: -0.11 }

  contact:
    none:
      base: { accessibility: 0.03, depth: -0.03 }
      conditions:
        accessibility:
          wealth: 0.219
        affinity:
          sportCulture: -0.219
    incidental:
      base: { accessibility: 0, depth: 0 }
      conditions:
        affinity:
          sportCulture: 0.11
        accessibility:
          wealth: -0.219
    full:
      base: { accessibility: -0.04, depth: 0.04 }
      conditions:
        accessibility:
          wealth: -0.438
        affinity:
          sportCulture: 0.329

  teamSize:
    small:
      base: { accessibility: 0.04, depth: -0.04 }
      conditions:
        affinity:
          sportCulture: -0.219
        accessibility:
          mediaMarket: -0.11
    medium:
      base: { depth: 0.015, accessibility: -0.015 }
      conditions:
        accessibility:
          urbanDensity: 0.219
    large:
      base: { accessibility: -0.025, depth: 0.025 }
      conditions:
        accessibility:
          urbanDensity: 0.219
        affinity:
          sportCulture: 0.219

  matchLength:
    short:
      base: { accessibility: 0.085, depth: -0.085 }
      conditions:
        accessibility:
          mediaMarket: 0.11
        affinity:
          urbanDensity: 0.438
    standard:
      base: { depth: 0.0 }
      conditions:
        depth:
          sportCulture: 0.131
        accessibility:
          mediaMarket: -0.219
          wealth: -0.263
    long:
      base: { accessibility: -0.06, depth: 0.06 }
      conditions:
        affinity:
          wealth: 0.329
          climate: { tropical: -0.219, arid: -0.219 }

  scoring:
    low:
      base: { accessibility: -0.03, depth: 0.03 }
      conditions:
        affinity:
          sportCulture: 0.329
    medium:
      base: { depth: 0.005, accessibility: -0.005 }
      conditions:
        accessibility:
          sportCulture: -0.219
    high:
      base: { accessibility: 0.095, depth: -0.095 }
      conditions:
        accessibility:
          mediaMarket: 0.219
          urbanDensity: 0.219
        affinity:
          sportCulture: -0.329

  complexity:
    simple:
      base: { accessibility: 0.13, depth: -0.13 }
      conditions:
        affinity:
          wealth: -0.219
    moderate:
      base: { depth: -0.01, accessibility: 0.01 }
      conditions:
        accessibility:
          # Trimmed 2026-09-19 from -0.219: 46% of top-quartile runs after the step 7 steepening.
          wealth: -0.16
        affinity:
          urbanDensity: -0.11
    intricate:
      base: { accessibility: -0.105, depth: 0.105 }
      conditions:
        affinity:
          wealth: 0.219
          sportCulture: 0.219

  structure:
    continuous:
      base: { accessibility: -0.005, depth: 0.005 }
      conditions:
        affinity:
          climate: { tropical: -0.219, cold: 0.11, arid: -0.219 }
          urbanDensity: -0.175
        accessibility:
          mediaMarket: -0.11
          wealth: -0.11
    stop-start:
      base: { accessibility: 0.08, depth: -0.08 }
      conditions:
        accessibility:
          mediaMarket: 0.219
        affinity:
          climate: { tropical: 0 }
          urbanDensity: 0.329
    innings:
      base: { accessibility: -0.02, depth: 0.02 }
      conditions:
        affinity:
          climate: { tropical: 0.11, arid: 0.11, cold: -0.219, temperate: -0.11 }
          wealth: 0

# Quick-start genome templates (GDD Onboarding). The first preset is the default genome when a
# host does not choose one (the worker-backed screen, the runner). The runner's differentiation
# experiment runs contrasting pairs of these.
presets:
  - id: backyard-kickball
    genome:
      surface: grass
      equipment: ball-only
      physical: speed
      footprint: small
      contact: incidental
      teamSize: small
      matchLength: short
      scoring: high
      complexity: simple
      structure: continuous
  - id: ice-paddle
    genome:
      surface: ice
      equipment: stick-or-bat
      physical: strength
      footprint: medium
      contact: full
      teamSize: medium
      matchLength: standard
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: street-court
    genome:
      surface: street
      equipment: ball-only
      physical: precision
      footprint: small
      contact: none
      teamSize: small
      matchLength: short
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: long-innings
    genome:
      surface: grass
      equipment: stick-or-bat
      physical: precision
      footprint: large
      contact: none
      teamSize: large
      matchLength: long
      scoring: high
      complexity: intricate
      structure: innings
