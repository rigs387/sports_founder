# Sport genome content (GDD Sport Genome). The axes and options themselves are fixed by design and
# declared in src/content/genome-axes.ts; this file must list every one of them, and carries every
# tunable number: each option's lever modifiers and its conditions on country attributes.
#
# Three levers per option, each a delta added to a multiplier that starts at 1 (see config.yaml
# `levers` for the clamps):
#   affinity       multiplies both casual and hardcore conversion ("does this sport fit here?")
#   accessibility  multiplies casual conversion (uninterested → casual)
#   depth          multiplies hardcore conversion (casual → hardcore)
#
# An option's `base` accessibility and depth deltas are a trade that costs nothing (decided
# 2026-09-21): base says what kind of sport an option makes - wide and shallow, or narrow and deep -
# never how good it is. Level, not geography, is what a dominance run measures, so an option
# carrying free level wins everywhere and the tuning never converges. The props removed had been
# holding up options that climate was crippling (ice +0.15, long +0.12, continuous +0.09), and the
# matching trims had been holding down whichever option was winning because of it (short -0.07,
# stop-start -0.04).
#
# Costing nothing means the two lever MULTIPLIERS multiply to 1, not that the deltas add to zero.
# The funnel is multiplicative - accessibility carries casual conversion, depth carries hardcore
# conversion, and hardcore flows out of casual - so an option's growth follows (1+acc) x (1+dep).
# Deltas adding to zero leave that product below 1 (+0.13/-0.13 gives 0.983), a quiet tax on
# committing to anything, and the option on each axis that commits to nothing wins: with the deltas
# merely summed to zero, footprint=medium (no base deltas at all) took 52% of top-quartile runs and
# complexity=moderate 47%. Run runs/level-bases.mjs after editing a base delta; it reports the tax
# it removed.
#
# Each option has `base` deltas (apply everywhere) and `conditions` on country attributes:
#   climate: { cold: +0.4, tropical: -0.45 }     categorical: the listed delta applies in that zone,
#                                                 less the map's population-weighted world mean, so
#                                                 an option's climate map averages out to nothing
#                                                 across the world (decided 2026-09-21; centred at
#                                                 load in src/content/derive.ts). Write the zones
#                                                 relative to each other: only the differences
#                                                 between them reach the simulation. A climate
#                                                 condition says where a sport does better, never
#                                                 whether it thrives at all.
#   wealth: +0.1                                  numeric, relative to the world: +0.1 in the most
#                                                 extreme country above the population-weighted world
#                                                 average, −0.1 in the most extreme below it, nothing
#                                                 at the average (linear in between)
# Numeric attributes: wealth, urbanDensity, sportCulture, mediaMarket.
#
# Every condition delta was scaled ×1.75 on 2026-09-18 (base deltas untouched). Once rivals hold
# their ground at the real data, rival-thin rich and urban markets saturated for every genome by the
# late game and differentiation fell to 3/6 pairs; steeper geography brings it back to 6/6 without
# shrinking total growth (pacing still passes; first win median turn 184).
# Scaled ×1.25 again on 2026-09-19 (×2.19 in all): the contested win hold has rivals defending their
# heartlands hardest in the late game, which pushed every genome back toward the same rival-thin
# markets (backyard-kickball vs street-court reached 5.0 shared). ×1.25 is the most that fits: ice's
# cold-climate affinity is at 1.97 of the lever limit of 2.
#
# Refitted per option on 2026-09-21, because ×2.19 had gone too far for the widest options. Growth
# compounds, so what an option is worth over a campaign is its population-weighted GEOMETRIC mean
# growth multiplier, not its average: ice averaged the best of any surface option (1.062) and
# compounded the worst (0.843), since its cold bonus stood at +2.27 against a lever clamp of 2.0 -
# half of it thrown away - while every penalty applied in full. The axis norm is about 0.985, and
# the options below it were scaled back to reach it: ice ×0.45 (0.965, its bonus now landing exactly
# at the clamp with nothing wasted), grass ×0.6, footprint large ×0.63, strength ×0.66, full contact
# ×0.69, long ×0.70, short ×0.82, small ×0.87, endurance ×0.92. Run runs/probe-fit.ts before
# steepening anything: it reports each option's geometric mean and the scale that would fix it.
#
# Design rule (GDD "No universal best option"): every option must help in, and hurt in, a real share
# of the actual countries (config genomeBalance). Content validation refuses one that does not.

options:
  surface:
    grass:
      base: { depth: 0.0 }
      conditions:
        affinity:
          # Trimmed 2026-09-19 (temperate 0.329, tropical 0.11): after the step 7 steepening grass
          # helped in most of the world's population and ran at 52% of top-quartile runs.
          climate: { temperate: 0.168, tropical: 0, cold: -0.197, arid: -0.263 }
        accessibility:
          urbanDensity: -0.263
    indoor:
      base: { depth: 0 }
      conditions:
        affinity:
          climate: { cold: 0.219, arid: 0.11, tropical: 0, temperate: -0.219 }
        accessibility:
          wealth: 0.11
          urbanDensity: 0.11
    street:
      base: { accessibility: 0.0619, depth: -0.0583 }
      conditions:
        affinity:
          climate: { cold: -0.329, arid: -0.11 }
        accessibility:
          urbanDensity: 0.548
          wealth: -0.438
    ice:
      base: { depth: 0.078, accessibility: -0.0724 }
      conditions:
        affinity:
          climate: { cold: 0.886, temperate: 0.05, arid: -0.295, tropical: -0.344 }
