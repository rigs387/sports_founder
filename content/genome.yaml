# Sport genome content (GDD Sport Genome). The axes and options themselves are fixed by design and
# declared in src/content/genome-axes.ts; this file must list every one of them, and carries every
# tunable number: each option's lever modifiers and its conditions on country attributes.
#
# Three levers per option, each a delta added to a multiplier that starts at 1 (see config.yaml
# `levers` for the clamps):
#   affinity       multiplies both casual and hardcore conversion ("does this sport fit here?")
#   accessibility  multiplies casual conversion (uninterested → casual)
#   depth          multiplies hardcore conversion (casual → hardcore)
#
# Each option has `base` deltas (apply everywhere) and `conditions` on country attributes:
#   climate: { cold: +0.4, tropical: -0.45 }     categorical: the listed delta applies in that zone
#   wealth: +0.1                                  numeric, relative to the world: +0.1 in the most
#                                                 extreme country above the population-weighted world
#                                                 average, −0.1 in the most extreme below it, nothing
#                                                 at the average (linear in between)
# Numeric attributes: wealth, urbanDensity, sportCulture, mediaMarket.
#
# Design rule (GDD "No universal best option"): every option must help in, and hurt in, a real share
# of the actual countries (config genomeBalance). Content validation refuses one that does not.

options:
  surface:
    grass:
      base: { depth: 0.03 }
      conditions:
        affinity:
          climate: { temperate: 0.15, tropical: 0.05, cold: -0.15, arid: -0.2 }
        accessibility:
          urbanDensity: -0.15
    indoor:
      base: { depth: 0 }
      conditions:
        affinity:
          climate: { cold: 0.1, arid: 0.05, tropical: 0, temperate: -0.1 }
        accessibility:
          wealth: 0.05
          urbanDensity: 0.05
    street:
      base: { accessibility: 0.07, depth: -0.05 }
      conditions:
        affinity:
          climate: { cold: -0.15, arid: -0.05 }
        accessibility:
          urbanDensity: 0.25
          wealth: -0.2
    ice:
      base: { depth: 0.15 }
      conditions:
        affinity:
          climate: { cold: 0.9, temperate: 0.05, arid: -0.3, tropical: -0.35 }
        accessibility:
          wealth: 0.15

  equipment:
    ball-only:
      base: { accessibility: 0.07, depth: -0.05 }
      conditions:
        accessibility:
          wealth: -0.15
        affinity:
          sportCulture: -0.05
    stick-or-bat:
      base: { accessibility: -0.03, depth: 0.05 }
      conditions:
        accessibility:
          wealth: 0.15
    protective-gear:
      base: { accessibility: -0.05, depth: 0.03 }
      conditions:
        accessibility:
          wealth: 0.15
        affinity:
          sportCulture: 0.05

  physical:
    speed:
      base: { accessibility: 0.03, depth: -0.04 }
      conditions:
        affinity:
          climate: { tropical: 0.05, arid: 0.05, cold: -0.1 }
        accessibility:
          urbanDensity: 0.05
    strength:
      base: { depth: 0.07 }
      conditions:
        affinity:
          climate: { cold: 0.25, temperate: 0.05, tropical: -0.15, arid: -0.05 }
        accessibility:
          sportCulture: 0.15
    precision:
      base: { accessibility: -0.02, depth: 0.01 }
      conditions:
        affinity:
          wealth: 0.05
          climate: { arid: 0.1 }
    endurance:
      base: { accessibility: 0.05, depth: 0.03 }
      conditions:
        affinity:
          climate: { temperate: 0.15, cold: 0.05, tropical: -0.1, arid: -0.05 }
          wealth: -0.1
          urbanDensity: -0.08

  footprint:
    small:
      base: { accessibility: 0.03, depth: -0.05 }
      conditions:
        accessibility:
          urbanDensity: 0.2
    medium:
      base: {}
      conditions:
        accessibility:
          urbanDensity: -0.1
        depth:
          wealth: 0.1
    large:
      base: { accessibility: -0.02, depth: 0.03 }
      conditions:
        accessibility:
          urbanDensity: -0.25
        affinity:
          climate: { temperate: 0.05, arid: -0.05 }

  contact:
    none:
      base: { accessibility: 0.03, depth: -0.03 }
      conditions:
        accessibility:
          wealth: 0.1
        affinity:
          sportCulture: -0.1
    incidental:
      base: { accessibility: 0, depth: 0 }
      conditions:
        affinity:
          sportCulture: 0.05
        accessibility:
          wealth: -0.1
    full:
      base: { accessibility: -0.03, depth: 0.05 }
      conditions:
        accessibility:
          wealth: -0.2
        affinity:
          sportCulture: 0.15

  teamSize:
    small:
      base: { accessibility: 0.03, depth: -0.05 }
      conditions:
        affinity:
          sportCulture: -0.1
        accessibility:
          mediaMarket: -0.05
    medium:
      base: { depth: 0.03 }
      conditions:
        accessibility:
          urbanDensity: 0.1
    large:
      base: { accessibility: -0.02, depth: 0.03 }
      conditions:
        accessibility:
          urbanDensity: 0.1
        affinity:
          sportCulture: 0.1

  matchLength:
    short:
      base: { accessibility: 0.05, depth: -0.12 }
      conditions:
        accessibility:
          mediaMarket: 0.05
        affinity:
          urbanDensity: 0.2
    standard:
      base: { depth: 0.0 }
      conditions:
        depth:
          sportCulture: 0.06
        accessibility:
          mediaMarket: -0.1
          wealth: -0.12
    long:
      base: { accessibility: 0, depth: 0.12 }
      conditions:
        affinity:
          wealth: 0.15
          climate: { tropical: -0.1, arid: -0.1 }

  scoring:
    low:
      base: { accessibility: -0.03, depth: 0.03 }
      conditions:
        affinity:
          sportCulture: 0.15
    medium:
      base: { depth: 0.01 }
      conditions:
        accessibility:
          sportCulture: -0.1
    high:
      base: { accessibility: 0.1, depth: -0.05 }
      conditions:
        accessibility:
          mediaMarket: 0.1
          urbanDensity: 0.1
        affinity:
          sportCulture: -0.15

  complexity:
    simple:
      base: { accessibility: 0.13, depth: -0.08 }
      conditions:
        affinity:
          wealth: -0.1
    moderate:
      base: { depth: -0.02 }
      conditions:
        accessibility:
          wealth: -0.1
        affinity:
          urbanDensity: -0.05
    intricate:
      base: { accessibility: -0.11, depth: 0.1 }
      conditions:
        affinity:
          wealth: 0.1
          sportCulture: 0.1

  structure:
    continuous:
      base: { accessibility: 0.04, depth: 0.05 }
      conditions:
        affinity:
          climate: { tropical: -0.1, cold: 0.05, arid: -0.1 }
          urbanDensity: -0.08
        accessibility:
          mediaMarket: -0.05
          wealth: -0.05
    stop-start:
      base: { accessibility: 0.08, depth: -0.05 }
      conditions:
        accessibility:
          mediaMarket: 0.1
        affinity:
          climate: { tropical: 0 }
          urbanDensity: 0.15
    innings:
      base: { accessibility: -0.04, depth: 0 }
      conditions:
        affinity:
          climate: { tropical: 0.05, arid: 0.05, cold: -0.1, temperate: -0.05 }
          wealth: 0

# Quick-start genome templates (GDD Onboarding). The first preset is the default genome when a
# host does not choose one (the worker-backed screen, the runner). The runner's differentiation
# experiment runs contrasting pairs of these.
presets:
  - id: backyard-kickball
    genome:
      surface: grass
      equipment: ball-only
      physical: speed
      footprint: small
      contact: incidental
      teamSize: small
      matchLength: short
      scoring: high
      complexity: simple
      structure: continuous
  - id: ice-paddle
    genome:
      surface: ice
      equipment: stick-or-bat
      physical: strength
      footprint: medium
      contact: full
      teamSize: medium
      matchLength: standard
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: street-court
    genome:
      surface: street
      equipment: ball-only
      physical: precision
      footprint: small
      contact: none
      teamSize: small
      matchLength: short
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: long-innings
    genome:
      surface: grass
      equipment: stick-or-bat
      physical: precision
      footprint: large
      contact: none
      teamSize: large
      matchLength: long
      scoring: high
      complexity: intricate
      structure: innings
