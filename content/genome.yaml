# Quick-start genome templates (GDD Onboarding). The first preset is the default genome when a
# host does not choose one (the worker-backed screen, the runner). The runner's differentiation
# experiment runs contrasting pairs of these.
presets:
  - id: backyard-kickball
    genome:
      surface: grass
      equipment: ball-only
      physical: speed
      footprint: small
      contact: incidental
      teamSize: small
      matchLength: short
      scoring: high
      complexity: simple
      structure: continuous
  - id: ice-paddle
    genome:
      surface: ice
      equipment: stick-or-bat
      physical: strength
      footprint: medium
      contact: full
      teamSize: medium
      matchLength: standard
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: street-court
    genome:
      surface: street
      equipment: ball-only
      physical: precision
      footprint: small
      contact: none
      teamSize: small
      matchLength: short
      scoring: medium
      complexity: moderate
      structure: stop-start
  - id: long-innings
    genome:
      surface: grass
      equipment: stick-or-bat
      physical: precision
      footprint: large
      contact: none
      teamSize: large
      matchLength: long
      scoring: high
      complexity: intricate
      structure: innings
